<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square with green border -->
  <rect x="32" y="32" width="448" height="448" rx="90" ry="90" fill="#ffffff" stroke="#16a34a" stroke-width="14"/>

  <!-- Hills / pasture at the bottom -->
  <path d="M 60 380 Q 180 320 280 360 T 460 350 L 460 460 Q 460 470 450 470 L 70 470 Q 60 470 60 460 Z" fill="#86efac"/>
  <path d="M 60 410 Q 200 360 320 400 T 460 395 L 460 460 Q 460 470 450 470 L 70 470 Q 60 470 60 460 Z" fill="#16a34a"/>

  <!-- Sun -->
  <circle cx="395" cy="170" r="32" fill="#fbbf24" opacity="0.9"/>

  <!-- Birds -->
  <path d="M 330 130 q 8 -8 16 0 q 8 -8 16 0" fill="none" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <path d="M 360 110 q 6 -6 12 0 q 6 -6 12 0" fill="none" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

  <!-- Leaf at top-left -->
  <ellipse cx="130" cy="110" rx="35" ry="55" fill="#16a34a" transform="rotate(-35 130 110)"/>
  <ellipse cx="135" cy="115" rx="28" ry="46" fill="#22c55e" transform="rotate(-35 135 115)"/>

  <!-- Cow head (centered) -->
  <!-- Head main shape (white) -->
  <ellipse cx="240" cy="270" rx="115" ry="120" fill="#ffffff" stroke="#1f2937" stroke-width="4"/>
  <!-- Black patches on head -->
  <path d="M 145 220 Q 130 280 165 320 Q 180 290 175 250 Z" fill="#1f2937"/>
  <path d="M 320 230 Q 340 290 315 330 Q 295 290 305 245 Z" fill="#1f2937"/>
  <path d="M 220 180 Q 195 200 195 230 Q 230 230 245 200 Z" fill="#1f2937"/>

  <!-- Ears -->
  <ellipse cx="155" cy="195" rx="28" ry="20" fill="#ffffff" stroke="#1f2937" stroke-width="3" transform="rotate(-25 155 195)"/>
  <ellipse cx="155" cy="200" rx="15" ry="10" fill="#fda4af" transform="rotate(-25 155 200)"/>
  <ellipse cx="325" cy="195" rx="28" ry="20" fill="#ffffff" stroke="#1f2937" stroke-width="3" transform="rotate(25 325 195)"/>
  <ellipse cx="325" cy="200" rx="15" ry="10" fill="#fda4af" transform="rotate(25 325 200)"/>

  <!-- Horns -->
  <path d="M 175 175 Q 165 145 178 130" fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>
  <path d="M 305 175 Q 315 145 302 130" fill="none" stroke="#1f2937" stroke-width="6" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="200" cy="265" rx="11" ry="13" fill="#1f2937"/>
  <ellipse cx="280" cy="265" rx="11" ry="13" fill="#1f2937"/>
  <circle cx="203" cy="261" r="3" fill="#ffffff"/>
  <circle cx="283" cy="261" r="3" fill="#ffffff"/>

  <!-- Nose / muzzle -->
  <ellipse cx="240" cy="335" rx="55" ry="40" fill="#fbcfe8" stroke="#1f2937" stroke-width="3"/>
  <ellipse cx="220" cy="335" rx="5" ry="7" fill="#1f2937"/>
  <ellipse cx="260" cy="335" rx="5" ry="7" fill="#1f2937"/>

  <!-- Smile -->
  <path d="M 215 360 Q 240 372 265 360" fill="none" stroke="#1f2937" stroke-width="3" stroke-linecap="round"/>

  <!-- Collar / tag -->
  <ellipse cx="240" cy="395" rx="55" ry="10" fill="#16a34a"/>
  <circle cx="240" cy="408" r="14" fill="#22c55e" stroke="#15803d" stroke-width="2"/>
  <path d="M 240 401 Q 234 408 240 415 Q 246 408 240 401 Z" fill="#ffffff"/>
</svg>
