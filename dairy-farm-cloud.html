<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ฟาร์มวัวนม">
<meta name="application-name" content="ฟาร์มวัวนม">
<title>ฟาร์มวัวนม - ระบบจัดการครบวงจร (Cloud)</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-new.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192-new.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f3f4f6; --card:#fff; --text:#1f2937; --text-muted:#6b7280;
  --border:#e5e7eb; --hover:#f9fafb; --th-bg:#f9fafb; --shadow:0 1px 3px rgba(0,0,0,.06);
  --input-bg:#fff; --primary:#16a34a;
}
body.dark{
  --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --text-muted:#94a3b8;
  --border:#334155; --hover:#334155; --th-bg:#0f172a; --shadow:0 1px 3px rgba(0,0,0,.3);
  --input-bg:#0f172a;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sukhumvit Set","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;transition:background .2s, color .2s}
.card{background:var(--card);box-shadow:var(--shadow)}
.stat{background:var(--card);box-shadow:var(--shadow)}
.table-wrap{background:var(--card);box-shadow:var(--shadow)}
.cow-card{background:var(--card);box-shadow:var(--shadow)}
.milk-card{background:var(--card);box-shadow:var(--shadow)}
.filter-bar{background:var(--card);box-shadow:var(--shadow)}
.modal{background:var(--card);color:var(--text)}
.cal{background:var(--card);box-shadow:var(--shadow)}
.alert-item{background:var(--card)}
.field input,.field select,.field textarea{background:var(--input-bg);color:var(--text);border-color:var(--border)}
.btn-sec{background:var(--card);color:var(--text);border-color:var(--border)}
.btn-sec:hover{background:var(--hover)}
th{background:var(--th-bg);color:var(--text-muted);border-bottom-color:var(--border)}
td{border-bottom-color:var(--border)}
tr:hover td{background:var(--hover)}
.quick-btn{background:var(--hover);color:var(--text-muted);border-color:var(--border)}
.quick-btn:hover{background:var(--border)}
.cal-day{background:var(--hover)}
.cal-day-head{background:var(--th-bg);color:var(--text-muted)}
.page-title{color:var(--text)}
.card-title{color:var(--text)}
.cow-code{color:var(--text)}
.muted,.stat-label,.stat-sub{color:var(--text-muted)}
body.dark .badge.gray{background:#334155;color:#cbd5e1}
body.dark .photo-thumb,body.dark .photo-card .photo-placeholder,body.dark .cow-card .photo-placeholder{background:#334155}
body.dark .photo-upload{border-color:var(--border)}
body.dark .photo-upload:hover{background:#1e293b}
/* Toast Notification */
.toast-stack{position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:360px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;color:#1f2937;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);font-size:14px;animation:toastIn .3s ease-out;border-left:4px solid #6b7280;pointer-events:auto}
.toast-info{border-left-color:#3b82f6}
.toast-success{border-left-color:#16a34a;background:#f0fdf4}
.toast-warn{border-left-color:#f59e0b;background:#fffbeb}
.toast-error{border-left-color:#dc2626;background:#fef2f2}
.toast-alert{border-left-color:#7c3aed;background:#faf5ff}
.toast-icon{font-size:18px;flex-shrink:0}
.toast-msg{flex:1;line-height:1.4}
.toast-x{background:transparent;border:none;color:#6b7280;cursor:pointer;font-size:20px;padding:0 4px;line-height:1}
.toast-x:hover{color:#1f2937}
.toast-fade{opacity:0;transform:translateX(20px);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
body.dark .toast{background:#1e293b;color:#e2e8f0}
body.dark .toast-success{background:#0a2a14}
body.dark .toast-warn{background:#2e1f08}
body.dark .toast-error{background:#2a0e0e}
body.dark .toast-alert{background:#1f0a3a}
@media(max-width:640px){.toast-stack{top:auto;bottom:80px;left:10px;right:10px;max-width:none}}
/* Plan expire banner */
.plan-banner{padding:10px 16px;border-radius:10px;margin:8px 16px 0;font-size:14px;cursor:pointer;text-align:center;transition:transform .15s;animation:slideDown .3s ease-out}
.plan-banner:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.plan-banner.warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.plan-banner.urgent{background:#fed7aa;color:#9a3412;border:1px solid #fb923c;animation:slideDown .3s ease-out, pulse 2s infinite}
.plan-banner.critical{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;font-weight:600;animation:slideDown .3s ease-out, pulse 2s infinite}
@keyframes slideDown{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}
/* Dark mode: input text สีอ่อน (แก้ปัญหาพิมพ์แล้วมองไม่เห็นเพราะ default ดำ) */
body.dark input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]):not([type="color"]):not([type="range"]):not([type="file"]),
body.dark select,
body.dark textarea{background:var(--input-bg);color:var(--text);border-color:var(--border)}
body.dark input::placeholder,body.dark textarea::placeholder{color:var(--text-muted);opacity:.7}
body.dark input[type="date"],body.dark input[type="time"],body.dark input[type="datetime-local"],body.dark input[type="month"]{color-scheme:dark}
/* Login pages: force light bg เสมอ (ไม่ตาม dark mode เพราะ login-box เป็นสีขาว) */
.login-box input,.login-box select,.login-box textarea{background:#fff !important;color:#111827 !important}
.login-box input::placeholder{color:#9ca3af !important}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ---- Login ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#16a34a 0%,#0d9488 100%)}
.login-box{background:#fff;border-radius:20px;padding:32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.login-logo{text-align:center;font-size:60px;margin-bottom:12px}
.login-title{text-align:center;font-size:22px;font-weight:700;color:#15803d;margin-bottom:6px}
.login-sub{text-align:center;color:#6b7280;font-size:13px;margin-bottom:24px}
.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.role-card{padding:18px 12px;border:2px solid #e5e7eb;border-radius:14px;text-align:center;cursor:pointer;transition:all .2s;background:#fff}
.role-card .icon{font-size:36px;margin-bottom:6px}
.role-card .label{font-weight:600;font-size:14px;color:#374151}
.role-card:hover{border-color:#16a34a;background:#f0fdf4}
.role-card.active{border-color:#16a34a;background:#dcfce7;box-shadow:0 4px 12px rgba(22,163,74,.2)}
.pin-input{width:100%;padding:14px;font-size:24px;text-align:center;border:2px solid #e5e7eb;border-radius:12px;letter-spacing:8px;margin-bottom:12px;font-weight:600}
.pin-input:focus{outline:none;border-color:#16a34a}
.btn-login{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-login:hover{background:#15803d}
.btn-login:disabled{background:#9ca3af;cursor:not-allowed}
.login-hint{margin-top:14px;font-size:11px;color:#9ca3af;text-align:center;line-height:1.6}
.login-err{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;text-align:center;display:none}
.login-err.show{display:block}

/* Cloud status badge */
.cloud-status{position:fixed;top:10px;right:10px;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;z-index:1000;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cloud-status.online{background:#dcfce7;color:#166534}
.cloud-status.offline{background:#fee2e2;color:#991b1b}
.cloud-status.syncing{background:#fef3c7;color:#92400e}
.cloud-status .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.cloud-status.syncing .dot{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ---- Main App ---- */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:240px;background:#1f2937;color:#fff;padding:16px 0;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto;z-index:50;transition:transform .3s}
.brand{padding:0 20px 16px;border-bottom:1px solid #374151;margin-bottom:12px}
.brand-name{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.brand-user{font-size:11px;color:#9ca3af;margin-top:4px}
.menu-section{padding:12px 20px 4px;font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:1px}
.menu-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;color:#d1d5db;transition:all .15s;font-size:13px;border-left:3px solid transparent}
.menu-item:hover{background:#374151;color:#fff}
.menu-item.active{background:#065f46;color:#fff;border-left-color:#10b981}
.menu-item .ic{font-size:16px;width:20px;text-align:center}
.btn-logout{margin:16px 20px;padding:10px;background:#dc2626;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
.btn-logout:hover{background:#b91c1c}

.main{flex:1;margin-left:240px;padding:20px;min-height:100vh}
.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:700;color:#111827}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.btn-primary{background:#16a34a;color:#fff}.btn-primary:hover{background:#15803d}
.btn-sec{background:#fff;color:#374151;border:1px solid #d1d5db}.btn-sec:hover{background:#f9fafb}
.btn-warn{background:#f59e0b;color:#fff}.btn-warn:hover{background:#d97706}
.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:5px 10px;font-size:12px}

/* Cards & Tables */
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;color:#374151}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid #16a34a}
.stat.blue{border-left-color:#3b82f6}
.stat.amber{border-left-color:#f59e0b}
.stat.red{border-left-color:#ef4444}
.stat.purple{border-left-color:#8b5cf6}
.stat-label{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:700;color:#111827}
.stat-sub{font-size:11px;color:#6b7280;margin-top:2px}
.big-stat{background:linear-gradient(135deg,#16a34a,#0d9488);color:#fff;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 4px 12px rgba(22,163,74,.25)}
.big-stat .label{font-size:13px;opacity:.9;margin-bottom:4px}
.big-stat .value{font-size:30px;font-weight:700}
.big-stat .sub{font-size:12px;opacity:.85;margin-top:4px}

table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 8px;background:#f9fafb;font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;font-weight:600;border-bottom:1px solid #e5e7eb}
td{padding:10px 8px;border-bottom:1px solid #f3f4f6;font-size:13px}
tr:hover td{background:#f9fafb}
.table-wrap{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form-grid.full{grid-template-columns:1fr}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:#6b7280;font-weight:500}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;background:#fff;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.1)}
.field textarea{min-height:60px;resize:vertical}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:24px}
.modal h3{font-size:18px;font-weight:600;margin-bottom:16px;color:#111827}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* Filter bar */
.filter-bar{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quick-btn{padding:6px 12px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:6px;cursor:pointer;font-size:12px;color:#4b5563}
.quick-btn:hover{background:#e5e7eb}
.quick-btn.active{background:#16a34a;color:#fff;border-color:#16a34a}
.filter-bar input[type="date"]{padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:12px}
.filter-bar select{padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:12px}
.filter-bar .lbl{font-size:12px;color:#6b7280;margin-right:4px}

/* Badges */
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge.green{background:#dcfce7;color:#166534}
.badge.blue{background:#dbeafe;color:#1e40af}
.badge.amber{background:#fef3c7;color:#92400e}
.badge.red{background:#fee2e2;color:#991b1b}
.badge.gray{background:#f3f4f6;color:#374151}
.badge.purple{background:#ede9fe;color:#6b21a8}

/* Cow cards */
.cow-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cow-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;border-left:4px solid #16a34a;transition:all .15s;display:flex;gap:10px;align-items:center}
.cow-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-2px)}
.cow-card .photo{width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#f3f4f6}
.cow-card .photo-placeholder{width:60px;height:60px;border-radius:8px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0}
.cow-card .info{flex:1;min-width:0}
.cow-code{font-size:14px;font-weight:700;color:#111827}
.cow-name{font-size:12px;color:#6b7280;margin-bottom:6px}
.cow-info{font-size:11px;color:#9ca3af}

/* Photo upload & gallery */
.photo-upload{border:2px dashed #d1d5db;border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all .15s;margin-top:8px}
.photo-upload:hover{border-color:#16a34a;background:#f0fdf4}
.photo-upload .ic{font-size:32px;color:#9ca3af}
.photo-upload .lbl{font-size:12px;color:#6b7280;margin-top:4px}
.photo-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photo-thumb{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;background:#f3f4f6;border:1px solid #e5e7eb}
.photo-thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.photo-thumb .del-btn{position:absolute;top:2px;right:2px;background:rgba(220,38,38,.9);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.photo-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.photo-gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;background:#f3f4f6;border:1px solid #e5e7eb;transition:transform .15s}
.photo-gallery img:hover{transform:scale(1.03);box-shadow:0 4px 12px rgba(0,0,0,.15)}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.lightbox.show{display:flex}
.lightbox img{max-width:95vw;max-height:95vh;border-radius:8px}
.lightbox .close-btn{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}

/* Quick milk entry */
.milk-card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.milk-card .info{flex:1;min-width:120px}
.milk-card input{width:80px;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;text-align:center}
.milk-card .ok{color:#16a34a;font-size:18px}

/* Calendar */
.cal{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day-head{padding:6px;text-align:center;font-size:11px;font-weight:600;color:#6b7280;background:#f9fafb}
.cal-day{min-height:70px;padding:6px;background:#f9fafb;border-radius:6px;font-size:11px}
.cal-day.today{background:#dcfce7;border:1px solid #16a34a}
.cal-day.empty{background:transparent}
.cal-num{font-weight:600;color:#374151;margin-bottom:3px}
.cal-event{background:#fef3c7;color:#92400e;padding:2px 4px;border-radius:3px;font-size:10px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-event.red{background:#fee2e2;color:#991b1b}
.cal-event.blue{background:#dbeafe;color:#1e40af}
.cal-event.green{background:#dcfce7;color:#166534}

/* Alerts */
.alert-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;border-left:4px solid #f59e0b}
.alert-item.urgent{border-left-color:#dc2626}
.alert-item .ic{font-size:24px}
.alert-item .body{flex:1}
.alert-item .ttl{font-weight:600;font-size:13px;color:#111827}
.alert-item .desc{font-size:12px;color:#6b7280;margin-top:2px}

/* Empty state */
.empty{text-align:center;padding:40px;color:#9ca3af}
.empty .ic{font-size:48px;margin-bottom:10px}

/* Mobile */
.menu-toggle{display:none;background:#1f2937;color:#fff;border:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:16px;margin-bottom:10px;min-height:40px}
@media(max-width:768px){
  body{font-size:13px}
  .sidebar{transform:translateX(-100%);box-shadow:4px 0 20px rgba(0,0,0,.3);width:240px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:8px;max-width:100vw;overflow-x:hidden}
  .menu-toggle{display:inline-flex}
  .cloud-status{top:auto;bottom:6px;right:6px;font-size:9px;padding:4px 8px}
  .page-title{font-size:15px;line-height:1.3}
  .page-head{margin-bottom:10px;gap:6px}
  .page-actions{gap:4px}
  /* Stats: 2-col compact */
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px}
  .stat{padding:8px;border-left-width:3px;border-radius:8px}
  .stat-value{font-size:14px;line-height:1.2}
  .stat-label{font-size:9px;margin-bottom:2px}
  .stat-sub{font-size:9px}
  .big-stat{padding:12px;margin-bottom:10px;border-radius:10px}
  .big-stat .label{font-size:11px}

<!-- Firebase SDK (CDN, modular v10) -->
<script type="module">

  projectId: "my-dairy-farm-ff891",
  storageBucket: "my-dairy-farm-ff891.firebasestorage.app",
  messagingSenderId: "391203447273",
  appId: "1:391203447273:web:cca0164cc715c65ee42b78"

// ตรวจว่า user override config ผ่าน localStorage หรือไม่

window.cloud = {

<script>
/* =============================================================
   DAIRY FARM CLOUD APP
   - Realtime sync via Firestore
   - Owner / Staff roles
   - Offline-first (uses Firestore IndexedDB cache)
   ============================================================= */

const $ = id => document.getElementById(id);
const fmt = n => (Number(n)||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const money = n => '฿'+fmt(n);
const today = () => new Date().toISOString().split('T')[0];
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// ================== DATA ==================
let DB = {
  v: 5,
  settings: {
    farmName: 'ฟาร์มวัวนม',
    ownerPin: '1234',
    milkPrice: 22,    // บาท/ลิตร (ราคารับซื้อปัจจุบัน)
    lastBackup: null
  },
  cows: [],
  milk: [],
  feed: [],
  health: [],
  breed: [],          // ผสมพันธุ์
  grass: [],          // แปลงหญ้า
  inventory: [],
  expenses: [],
  income: [],
  employees: [],
  payroll: [],
  timeclock: [],      // ลงเวลาทำงาน
  tasks: [],          // มอบหมายงาน
  weights: [],        // ชั่งน้ำหนักวัว
  bcs: [],            // Body Condition Score
  env: [],            // อุณหภูมิ/ความชื้นคอก
  heats: [],          // สัญญาณการเป็นสัด
  logs: []            // log ทุกการเปลี่ยนแปลง
};

let currentUser = null;  // {role:'owner'|'staff', name, empId}
let cloudReady = false;
let unsubscribe = null;
let isSaving = false;

// ================== CLOUD SYNC ==================
async function loadFromCloud(){
  if(!window.cloud) return false;
  try{
    setStatus('syncing','โหลดข้อมูล...');
    const ref = window.cloud.doc(window.cloud.db, 'farms', window.cloud.farmId());
    const snap = await window.cloud.getDoc(ref);
    if(snap.exists()){
      const data = snap.data();
      DB = {...DB, ...data};
      // ensure structure
      DB.settings = DB.settings || {ownerPin:'1234',milkPrice:22};
      ['cows','milk','feed','health','breed','grass','inventory','expenses','income','employees','payroll','timeclock','tasks','weights','bcs','env','heats','logs'].forEach(k=>{
        if(!Array.isArray(DB[k])) DB[k]=[];
      });
    } else {
      // ฟาร์มใหม่ — seed ข้อมูลตัวอย่าง
      seedSampleData();
      await saveToCloud();
    }
    setStatus('online','เชื่อมต่อแล้ว');
    return true;
  }catch(e){
    console.error('loadFromCloud:',e);
    setStatus('offline','โหมดออฟไลน์');
    return false;
  }
}

async function saveToCloud(){
  if(!window.cloud || isSaving) return;
  isSaving = true;
  try{
    setStatus('syncing','บันทึก...');
    const ref = window.cloud.doc(window.cloud.db, 'farms', window.cloud.farmId());
    await window.cloud.setDoc(ref, DB);
    setStatus('online','บันทึกแล้ว');
  }catch(e){
    console.error('saveToCloud:',e);
    setStatus('offline','ออฟไลน์ - บันทึกในเครื่อง');
    // fallback to localStorage
    try{ localStorage.setItem('dairy-farm-v5', JSON.stringify(DB)); }catch(_){}
  }finally{
    isSaving = false;
  }
}

function subscribeCloud(){
  if(!window.cloud) return;
  if(unsubscribe){ unsubscribe(); }
  const ref = window.cloud.doc(window.cloud.db, 'farms', window.cloud.farmId());
  unsubscribe = window.cloud.onSnapshot(ref, snap=>{
    if(snap.exists() && !isSaving){
      const remote = snap.data();
      // เช็คว่าข้อมูลใหม่กว่าหรือเปล่า
      DB = {...DB, ...remote};
      if(currentUser) refresh();
    }
  }, err=>{
    console.error('snapshot err:', err);
    setStatus('offline','ออฟไลน์');
  });
}

function setStatus(state, text){
  const el = $('cloudStatus');
  if(!el) return;
  el.className = 'cloud-status '+state;
  $('cloudStatusText').textContent = text;
}

// Debounced save
let saveTimer = null;
function save(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>saveToCloud(), 400);
  // backup ทันทีลง localStorage
  try{ localStorage.setItem('dairy-farm-v5', JSON.stringify(DB)); }catch(_){}
}

function log(action, detail){
  DB.logs = DB.logs || [];
  DB.logs.unshift({
    id: uid(), date: new Date().toISOString(),
    user: currentUser?.name || 'ระบบ',
    role: currentUser?.role || '',
    action, detail
  });
  if(DB.logs.length>500) DB.logs = DB.logs.slice(0,500);
}

// ================== SEED ==================
function seedSampleData(){
  DB.cows = [
    {id:uid(),code:'C001',name:'นางทอง',breed:'โฮลสไตน์-ฟรีเซียน',birth:'2022-03-15',weight:550,status:'lactating',lactation:2,calveDate:'2025-11-10',notes:''},
    {id:uid(),code:'C002',name:'นางเขียว',breed:'เจอร์ซีย์',birth:'2021-07-20',weight:480,status:'lactating',lactation:3,calveDate:'2025-12-05',notes:''},
    {id:uid(),code:'C003',name:'นางขาว',breed:'โฮลสไตน์-ฟรีเซียน',birth:'2023-02-10',weight:520,status:'pregnant',lactation:1,calveDate:'2025-04-18',notes:''}
  ];
  DB.employees = [
    {id:uid(),name:'สมชาย ใจดี',idCard:'1-2345-6789',position:'หัวหน้าฟาร์ม',wageType:'monthly',wage:15000,pin:'1111'},
    {id:uid(),name:'สมหญิง ขยัน',idCard:'1-9876-5432',position:'พนักงานรีดนม',wageType:'daily',wage:400,pin:'2222'}
  ];
  // milk records (7 days)
  const today_ = new Date();
  for(let i=6;i>=0;i--){
    const d = new Date(today_); d.setDate(d.getDate()-i);
    const ds = d.toISOString().split('T')[0];
    DB.cows.filter(c=>c.status==='lactating').forEach(c=>{
      DB.milk.push({id:uid(),date:ds,cowId:c.id,session:'morning',amount:12+Math.random()*3,fat:3.8,protein:3.2,recordedBy:'สมหญิง ขยัน'});
      DB.milk.push({id:uid(),date:ds,cowId:c.id,session:'evening',amount:10+Math.random()*3,fat:3.7,protein:3.1,recordedBy:'สมหญิง ขยัน'});
    });
  }
  DB.inventory = [
    {id:uid(),name:'อาหารข้น 18%',type:'feed',qty:500,unit:'กก.',minStock:100,price:18,supplier:'CP'},
    {id:uid(),name:'หญ้าหมัก',type:'feed',qty:2000,unit:'กก.',minStock:500,price:3,supplier:'ฟาร์มในพื้นที่'}
  ];
}

// ================== SAAS AUTH (Firebase) ==================
let authUser = null;     // Firebase Auth user
let userPlan = null;     // {plan: 'trial'|'basic'|'pro', trialEndsAt, paidUntil}
let isAdmin = false;     // เจ้าของระบบ (Parke)
const ADMIN_EMAILS = ['keatikoon@gmail.com'];  // เจ้าของระบบ
const PLANS = {
  trial:    {name:'ทดลองใช้', maxCows: 5,   maxEmployees: 2, price: 0,   durationDays: 14},
  basic:    {name:'Basic',    maxCows: 30,  maxEmployees: 5, price: 199, durationDays: 30},
  pro:      {name:'Pro',      maxCows: 200, maxEmployees: 50, price: 990, durationDays: 30},
  enterprise:{name:'Enterprise', maxCows: 99999, maxEmployees: 999, price: 0, durationDays: 36500}
};

function planExpired(){
  if(!userPlan) return true;
  if(userPlan.plan === 'enterprise') return false;
  if(userPlan.plan === 'trial'){
    if(userPlan.trialEndsAt && new Date(userPlan.trialEndsAt) > new Date()) return false;
    return true;
  }
  if(userPlan.paidUntil && new Date(userPlan.paidUntil) > new Date()) return false;
  return true;
}

function daysLeft(){
  if(!userPlan) return 0;
  const target = userPlan.plan==='trial' ? userPlan.trialEndsAt : userPlan.paidUntil;
  if(!target) return 0;
  return Math.max(0, Math.ceil((new Date(target) - new Date()) / (1000*60*60*24)));
}

async function loadUserPlan(uid){
  if(!window.cloud) return null;
  try{
    const ref = window.cloud.doc(window.cloud.db, 'users', uid);
    const snap = await window.cloud.getDoc(ref);
    if(snap.exists()) return snap.data();
    // ถ้ายังไม่มี — สร้าง trial
    const trialEnds = new Date();
    trialEnds.setDate(trialEnds.getDate() + 14);
    const data = {
      uid, email: authUser?.email, displayName: authUser?.displayName||'',
      plan: 'trial',
      trialEndsAt: trialEnds.toISOString(),
      createdAt: new Date().toISOString(),
      farmName: 'ฟาร์มของฉัน'
    };
    await window.cloud.setDoc(ref, data);
    return data;
  }catch(e){ console.error('loadUserPlan',e); return null; }
}

function startAuthListener(){
  if(!window.cloud) return;
  window.cloud.onAuthStateChanged(window.cloud.auth, async (user) => {
    if(user){
      authUser = user;
      isAdmin = ADMIN_EMAILS.includes(user.email);
      // ตั้ง Farm ID = UID (multi-tenant)
      window.cloud.setFarmId(user.uid);
      userPlan = await loadUserPlan(user.uid);
      // โหลดข้อมูลฟาร์ม
      await loadFromCloud();
      subscribeCloud();
      // ถ้า plan หมดอายุ → แสดงหน้าต่ออายุ (renderInternalLogin จะ check)
      if(planExpired()){
        renderInternalLogin();
        return;
      }
      // Owner ที่ login Firebase = owner ของ farm นี้ → enter app เลย ไม่ต้องเลือก role + PIN
      currentUser = {role:'owner', name:'เจ้าของฟาร์ม'};
      saveSession();
      enterApp();
    } else {
      authUser = null;
      userPlan = null;
      isAdmin = false;
      window.cloud.setFarmId(null);
      currentUser = null;
      clearSession();
      if(unsubscribe){ unsubscribe(); unsubscribe = null; }
      renderLanding();
    }
  });
}

async function signUp(email, password, farmName, extra){
  const cred = await window.cloud.createUserWithEmailAndPassword(window.cloud.auth, email, password);
  if(farmName) await window.cloud.updateProfile(cred.user, {displayName: farmName});
  // สร้าง user document พร้อม trial 14 วัน
  const trialEnds = new Date();
  trialEnds.setDate(trialEnds.getDate() + 14);
  await window.cloud.setDoc(window.cloud.doc(window.cloud.db, 'users', cred.user.uid), {
    uid: cred.user.uid, email, displayName: farmName||'',
    plan: 'trial', trialEndsAt: trialEnds.toISOString(),
    createdAt: new Date().toISOString(), farmName: farmName||'ฟาร์มของฉัน',
    ownerName: extra?.name || '',
    phone: extra?.phone || '',
    agreedTerms: true,
    agreedAt: new Date().toISOString()
  });
  return cred.user;
}

async function signIn(email, password){
  return window.cloud.signInWithEmailAndPassword(window.cloud.auth, email, password);
}

async function signInGoogle(){
  const provider = new window.cloud.GoogleAuthProvider();
  return window.cloud.signInWithPopup(window.cloud.auth, provider);
}

async function signOutUser(){
  await window.cloud.signOut(window.cloud.auth);
  clearSession();
  localStorage.removeItem('dairy-farm-v5');
  location.reload();
}

// ================== AUTH / LOGIN (Internal PIN) ==================
let selectedRole = null;

function renderInternalLogin(){
  // PIN login ภายในฟาร์ม (หลัง Firebase Auth)
  const app = $('app');
  const expired = planExpired();
  const days = daysLeft();
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <div style="text-align:right;font-size:11px;color:#6b7280;margin-bottom:8px">
          ${authUser?.email||''} <a href="#" onclick="event.preventDefault();signOutUser()" style="color:#dc2626;margin-left:8px">ออก</a>
        </div>
        <div class="login-logo">🐄</div>
        <div class="login-title">${userPlan?.farmName||'ฟาร์มวัวนม'}</div>
        <div class="login-sub">
          ${expired ? '<span style="color:#dc2626">⚠️ '+(userPlan?.plan==='trial'?'หมดช่วงทดลอง':'หมดอายุ')+' — กรุณาต่ออายุ</span>'
            : userPlan?.plan==='trial' ? `🎁 ทดลองใช้ฟรี เหลือ <b>${days} วัน</b>`
            : `📋 Plan: <b>${PLANS[userPlan?.plan]?.name||'?'}</b> · เหลือ ${days} วัน`}
        </div>
        ${expired ? `
          <button class="btn btn-primary" style="width:100%;margin-top:14px;padding:14px" onclick="showPricingPage()">💳 ต่ออายุ / อัพเกรด</button>
        ` : `
          <div class="role-cards">
            <div class="role-card" data-role="owner" onclick="selectRole('owner')">
              <div class="icon">👨‍🌾</div>
              <div class="label">เจ้าของฟาร์ม</div>
            </div>
            <div class="role-card" data-role="staff" onclick="selectRole('staff')">
              <div class="icon">👷</div>
              <div class="label">พนักงาน</div>
            </div>
          </div>

let staffFarmId = null; // เก็บ Farm ID ที่ staff เข้ามา

async function startStaffLogin(farmId){
  staffFarmId = farmId;
  // แสดง loading ก่อน
  renderLoading();
  try{
    // Set farm ID + load farm doc จาก Firestore (allow read: if true ใน rules)
    window.cloud.setFarmId(farmId);
    await loadFromCloud();
    // ถ้ามี session ของ staff อยู่แล้ว + farm ID ตรงกัน → restore + enter app
    const savedSession = loadSession();
    const savedFarm = (()=>{try{return localStorage.getItem('dairy-staff-farm');}catch(e){return null;}})();
    if(savedSession && savedSession.role==='staff' && savedFarm===farmId){
      // verify ว่า user ยังมีอยู่ + active
      const emp = (DB.employees||[]).find(e=>e.id===savedSession.empId);
      if(emp && emp.active !== false){
        currentUser = savedSession;
        try{ subscribeCloud(); }catch(e){}
        renderShell();
        let sp = null;
        try{ sp = localStorage.getItem('dairy-current-page'); }catch(e){}
        const allowed = Array.from(document.querySelectorAll('.menu-item')).map(m=>m.dataset.page);
        let def = 'milkQuick';
        if(!allowed.includes(def)) def = allowed[0] || 'milkQuick';
        showPage((sp && allowed.includes(sp)) ? sp : def);
        return;
      }
    }
    // ไม่มี session → render staff login page
    renderStaffLoginPage();
  } catch(e){
    console.error('startStaffLogin:', e);
    renderStaffLoginPage('ไม่สามารถโหลดข้อมูลฟาร์มได้ — กรุณาตรวจ URL หรือติดต่อเจ้าของฟาร์ม');
  }
}

function doStaffLogin(){
  const username = ($('sf_user').value||'').trim().toLowerCase();
  const password = ($('sf_pass').value||'').trim();
  const err = $('staffLoginErr');
  if(!username || !password){
    err.textContent = 'กรุณากรอก Username และ Password';
    err.classList.add('show');
    return;
  }
  const emp = (DB.employees||[]).find(e=>(e.username||'').toLowerCase()===username && e.password===password);
  if(!emp){
    err.textContent = 'Username หรือ Password ไม่ถูกต้อง';
    err.classList.add('show');
    return;
  }
  if(emp.active === false){
    err.textContent = 'บัญชีนี้ถูกระงับการใช้งาน — ติดต่อเจ้าของฟาร์ม';
    err.classList.add('show');
    return;
  }
  // Subscribe Firestore เพื่อ realtime
  try{ subscribeCloud(); }catch(e){}
  currentUser = {role:'staff', name:emp.name, empId:emp.id, username:emp.username, permissions: emp.permissions||[]};
  saveSession();
  // เก็บ farmId ของ staff session เพื่อ restore หลัง refresh
  try{ localStorage.setItem('dairy-staff-farm', staffFarmId); }catch(e){}
  log('login','พนักงาน '+emp.name+' เข้าสู่ระบบ (URL)');
  // Enter app — ข้าม PIN page ของ Internal login เพราะ staff ไม่ใช่ owner
  renderShell();
  let savedPage = null;
  try{ savedPage = localStorage.getItem('dairy-current-page'); }catch(e){}
  const allowedPages = Array.from(document.querySelectorAll('.menu-item')).map(m=>m.dataset.page);
  let defaultPage = 'milkQuick';
  if(!allowedPages.includes(defaultPage)) defaultPage = allowedPages[0] || 'milkQuick';
  showPage((savedPage && allowedPages.includes(savedPage)) ? savedPage : defaultPage);
}

const PROMPTPAY_NUMBER = '0652536145';
const ADMIN_BANK = 'พร้อมเพย์: 065-253-6145 (FarmMeth)';

// ====== PromptPay QR Code (EMV standard) ======
// Format: https://www.bot.or.th/Thai/PaymentSystems/StandardPS/Pages/ThaiQRPayment.aspx
function _ppCrc16(s){
  let crc = 0xFFFF;
  for(let i=0;i<s.length;i++){
    crc ^= s.charCodeAt(i)<<8;
    for(let j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc<<1) ^ 0x1021) : (crc<<1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function _ppTLV(id, val){ return id + String(val.length).padStart(2,'0') + val; }
function generatePromptPayPayload(phoneOrId, amount){
  // เบอร์: ตัด 0 ตัวแรก + prefix 0066 → 13 หลัก
  // เลขบัตรประชาชน 13 หลัก: ใช้ตรง
  const clean = String(phoneOrId).replace(/[^0-9]/g,'');
  let target;
  if(clean.length === 13){
    target = clean; // citizen ID
  } else {
    const phone = clean.startsWith('0') ? clean.slice(1) : clean;
    target = '0066' + phone; // 13 digits total
  }
  const merchant = _ppTLV('00','A000000677010111') + _ppTLV('01', target);
  let data = '';
  data += _ppTLV('00','01');
  data += _ppTLV('01', amount > 0 ? '12' : '11');
  data += _ppTLV('29', merchant);
  data += _ppTLV('53','764');
  if(amount > 0) data += _ppTLV('54', Number(amount).toFixed(2));
  data += _ppTLV('58','TH');
  data += '6304' + _ppCrc16(data + '6304');
  return data;
}
function renderPromptPayQR(elId, phoneOrId, amount, size){
  const payload = generatePromptPayPayload(phoneOrId, amount);
  if(typeof qrcode === 'undefined'){
    return '<div style="color:#dc2626;font-size:12px">โหลด QR library ไม่สำเร็จ — กรุณา refresh</div>';
  }
  const qr = qrcode(0, 'M');
  qr.addData(payload);
  qr.make();
  return qr.createImgTag(size||4, 8); // cell size, margin
}

// แจ้งเตือน admin (Parke) ทาง Telegram/LINE เมื่อมี payment ใหม่
// ตั้งค่า ADMIN_NOTIFY ใน Firestore: ดูที่ collection "admin_config" doc "notify"
// {telegramToken, telegramChatId, lineToken, lineUserId}
async function notifyAdminNewPayment(payDoc){
  try{
    const cfgRef = window.cloud.doc(window.cloud.db, 'admin_config', 'notify');
    const snap = await window.cloud.getDoc(cfgRef);
    if(!snap.exists()) return;
    const cfg = snap.data();
    const planName = PLANS[payDoc.plan]?.name || payDoc.plan;
    const msg = `💳 *Payment ใหม่!*\n\n` +
      `📧 ${payDoc.email}\n` +
      `📋 แผน: ${planName} (${payDoc.durationDays} วัน)\n` +
      `💰 ฿${payDoc.amount}\n` +
      (payDoc.note?`📝 ${payDoc.note}\n`:'') +
      `\n🔗 farmmeth.com/?admin=1 → ยืนยัน`;
    // Telegram
    if(cfg.telegramToken && cfg.telegramChatId){
      fetch(`https://api.telegram.org/bot${cfg.telegramToken}/sendMessage`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({chat_id: cfg.telegramChatId, text: msg, parse_mode:'Markdown'})
      }).catch(()=>{});
    }
    // LINE (ผ่าน Cloudflare Worker)
    if(cfg.lineToken && cfg.lineUserId){
      fetch('https://farmmeth-line-proxy.keatikoon.workers.dev/', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({token: cfg.lineToken, to: cfg.lineUserId, text: msg.replace(/\*/g,'')})
      }).catch(()=>{});
    }
  }catch(e){ console.warn('notifyAdminNewPayment:', e); }
}

async function approvePayment(paymentId, userUid, plan, days){
  if(!confirm(`ยืนยันการชำระเงิน?\nUID: ${userUid}\nPlan: ${plan} +${days} วัน`)) return;
  try{
    // คำนวณวันหมดอายุใหม่
    const userRef = window.cloud.doc(window.cloud.db, 'users', userUid);
    const userSnap = await window.cloud.getDoc(userRef);
    let paidUntil = new Date();
    if(userSnap.exists()){
      const u = userSnap.data();
      if(u.paidUntil && new Date(u.paidUntil)>paidUntil) paidUntil = new Date(u.paidUntil);
    }
    paidUntil.setDate(paidUntil.getDate() + (+days||30));
    await window.cloud.updateDoc(userRef, {plan, paidUntil: paidUntil.toISOString()});
    // อัพเดท payment status
    await window.cloud.updateDoc(window.cloud.doc(window.cloud.db, 'payments', paymentId), {
      status:'approved', approvedAt: new Date().toISOString(), approvedBy: authUser.email
    });
    alert('✅ ยืนยันแล้ว');
    showAdminPage();
  }catch(e){ alert('Error: '+e.message); }
}

async function rejectPayment(paymentId){
  if(!confirm('ปฏิเสธรายการนี้?')) return;
  try{
    await window.cloud.updateDoc(window.cloud.doc(window.cloud.db, 'payments', paymentId), {
      status:'rejected', rejectedAt: new Date().toISOString(), rejectedBy: authUser.email
    });
    alert('ปฏิเสธแล้ว');
    showAdminPage();
  }catch(e){ alert('Error: '+e.message); }
}

function selectRole(role){
  selectedRole = role;
  document.querySelectorAll('.role-card').forEach(c=>c.classList.remove('active'));
  document.querySelector(`[data-role="${role}"]`)?.classList.add('active');
  $('btnLogin').disabled = false;
  // Staff → แสดงทั้ง username/password และ PIN ; Owner → แค่ PIN
  const userPassFields = $('userPassFields');
  if(role === 'staff'){
    if(userPassFields) userPassFields.style.display = 'block';
    const pinInput = $('pinInput');
    if(pinInput) pinInput.placeholder = 'หรือใช้ PIN';
    $('usernameInput')?.focus();
  } else {
    if(userPassFields) userPassFields.style.display = 'none';
    const pinInput = $('pinInput');
    if(pinInput) pinInput.placeholder = '••••';
    pinInput?.focus();
  }
}

function doLogin(){
  const pin = ($('pinInput').value||'').trim();
  const username = ($('usernameInput')?.value||'').trim().toLowerCase();
  const password = ($('passwordInput')?.value||'').trim();
  const err = $('loginErr');
  if(!selectedRole){ err.textContent='กรุณาเลือกประเภทผู้ใช้'; err.classList.add('show'); return; }

  if(selectedRole==='owner'){
    if(!pin){ err.textContent='กรุณากรอก PIN เจ้าของฟาร์ม'; err.classList.add('show'); return; }
    if(pin === (DB.settings.ownerPin||'1234')){
      currentUser = {role:'owner', name:'เจ้าของฟาร์ม'};
      saveSession();
      log('login','เจ้าของเข้าสู่ระบบ');
      enterApp();
    } else {
      err.textContent='PIN ไม่ถูกต้อง'; err.classList.add('show');
    }
    return;
  }

  // STAFF — ลอง Username/Password ก่อน → ถ้าไม่ใส่ใช้ PIN
  if(username && password){
    const emp = DB.employees.find(e=>(e.username||'').toLowerCase()===username && e.password===password);
    if(emp){
      if(emp.active === false){
        err.textContent='บัญชีนี้ถูกระงับการใช้งาน — ติดต่อเจ้าของฟาร์ม'; err.classList.add('show'); return;
      }
      currentUser = {role:'staff', name:emp.name, empId:emp.id, username:emp.username, permissions: emp.permissions||[]};
      saveSession();
      log('login','พนักงาน '+emp.name+' เข้าสู่ระบบ (user)');
      enterApp();
      return;
    }
    err.textContent='Username หรือ Password ไม่ถูกต้อง'; err.classList.add('show'); return;
  }

  // STAFF — Fallback ใช้ PIN
  if(!pin){ err.textContent='กรุณากรอก Username/Password หรือ PIN'; err.classList.add('show'); return; }
  const empByPin = DB.employees.find(e=>e.pin===pin && e.pin);
  if(empByPin){
    if(empByPin.active === false){
      err.textContent='บัญชีนี้ถูกระงับการใช้งาน — ติดต่อเจ้าของฟาร์ม'; err.classList.add('show'); return;
    }
    currentUser = {role:'staff', name:empByPin.name, empId:empByPin.id, permissions: empByPin.permissions||[]};
    saveSession();
    log('login','พนักงาน '+empByPin.name+' เข้าสู่ระบบ (pin)');
    enterApp();
  } else if(pin==='0000'){
    currentUser = {role:'staff', name:'พนักงานทั่วไป', permissions: null};
    saveSession();
    log('login','พนักงานทั่วไปเข้าสู่ระบบ');
    enterApp();
  } else {
    err.textContent='PIN ไม่ถูกต้อง'; err.classList.add('show');
  }
}

function saveSession(){
  try{ localStorage.setItem('dairy-session', JSON.stringify(currentUser)); }catch(e){}
}
function loadSession(){
  try{
    const s = localStorage.getItem('dairy-session');
    if(s) return JSON.parse(s);
  }catch(e){}
  return null;
}
function clearSession(){
  try{
    localStorage.removeItem('dairy-session');
    localStorage.removeItem('dairy-current-page');
  }catch(e){}
}

function logout(){
  log('logout', currentUser?.name+' ออกจากระบบ');
  save();
  clearSession();
  currentUser = null;
  selectedRole = null;
  if(unsubscribe){ unsubscribe(); unsubscribe=null; }
  renderLogin();
}

function saveSetup(){
  const cfgText = $('cfgInput').value.trim();
  const farmId = $('farmIdInput').value.trim() || 'default-farm';
  if(cfgText){
    try{
      const cfg = JSON.parse(cfgText);
      localStorage.setItem('firebaseCfg', JSON.stringify(cfg));
    }catch(e){
      alert('Config ไม่ถูกต้อง: '+e.message); return;
    }
  } else {
    localStorage.removeItem('firebaseCfg');
  }
  localStorage.setItem('farmId', farmId);
  alert('บันทึกแล้ว — กำลังโหลดใหม่');
  location.reload();
}

async function enterApp(){
  if(window.cloud){
    cloudReady = true;
    await loadFromCloud();
    subscribeCloud();
  } else {
    // fallback to localStorage
    try{
      const local = localStorage.getItem('dairy-farm-v5');
      if(local) DB = {...DB, ...JSON.parse(local)};
    }catch(e){}
    setStatus('offline','โหมดออฟไลน์ (ไม่มี Cloud)');
  }
  renderShell();
  // Restore page ที่ user เปิดอยู่ก่อน refresh (ถ้ามี + role อนุญาต)
  let savedPage = null;
  try{ savedPage = localStorage.getItem('dairy-current-page'); }catch(e){}
  const allowedPages = Array.from(document.querySelectorAll('.menu-item')).map(m=>m.dataset.page);
  let defaultPage = currentUser.role==='owner' ? 'dashboard' : 'milkQuick';
  if(!allowedPages.includes(defaultPage)) defaultPage = allowedPages[0] || 'dashboard';
  showPage((savedPage && allowedPages.includes(savedPage)) ? savedPage : defaultPage);

  // Smart reminder + AI insight — ตรวจครั้งแรก 5 วินาทีหลัง enterApp, จากนั้นทุก 1 ชั่วโมง
  setTimeout(()=>{ try{ runRemindersCheck(false); }catch(e){console.error(e);} }, 5000);
  if(!window._remindersInterval){
    window._remindersInterval = setInterval(()=>{ try{ runRemindersCheck(true); }catch(e){} }, 60*60*1000);
  }
  // Auto-backup check (รอ 10 วินาทีให้ DB โหลดเสร็จก่อน)
  setTimeout(()=>{ try{ checkAutoBackup(); }catch(e){console.error(e);} }, 10000);
}

// Banner เตือนเมื่อ plan ใกล้หมดอายุ (เฉพาะ Owner)
function renderPlanBanner(){
  if(!authUser || !userPlan) return '';
  if(currentUser?.role !== 'owner') return ''; // staff ไม่ต้องเห็น banner ต่ออายุ
  const days = daysLeft();
  const planName = PLANS[userPlan.plan]?.name || userPlan.plan;
  const isTrial = userPlan.plan === 'trial';
  if(planExpired()){
    return `<div class="plan-banner critical" onclick="showPricingPage()">
      ⛔ <b>${isTrial?'ทดลองหมดอายุแล้ว':'แผน '+planName+' หมดอายุ'}</b> — คลิกเพื่อต่ออายุ
    </div>`;
  }
  if(days <= 3){
    return `<div class="plan-banner urgent" onclick="showPricingPage()">
      ⏰ <b>${isTrial?'เหลือทดลองอีก':'แผน '+planName+' เหลือ'} ${days} วัน</b> — กดที่นี่เพื่อต่ออายุ
    </div>`;
  }
  if(days <= 7){
    return `<div class="plan-banner warn" onclick="showPricingPage()">
      ⚠️ ${isTrial?'ทดลองเหลือ':'แผน '+planName+' เหลือ'} ${days} วัน — <u>ต่ออายุก่อนหมด</u>
    </div>`;
  }
  return '';
}

// ================== DATE RANGE HELPERS ==================
function getRange(preset){
  const t = new Date();
  const fmt = d => d.toISOString().split('T')[0];
  const tt = fmt(t);
  switch(preset){
    case 'today': return {from:tt,to:tt};
    case 'yesterday': { const y=new Date(t); y.setDate(y.getDate()-1); return {from:fmt(y),to:fmt(y)}; }
    case '7d': { const f=new Date(t); f.setDate(f.getDate()-6); return {from:fmt(f),to:tt}; }
    case '30d': { const f=new Date(t); f.setDate(f.getDate()-29); return {from:fmt(f),to:tt}; }
    case 'month': { const f=new Date(t.getFullYear(),t.getMonth(),1); return {from:fmt(f),to:tt}; }
    case 'lastmonth': { const f=new Date(t.getFullYear(),t.getMonth()-1,1); const to=new Date(t.getFullYear(),t.getMonth(),0); return {from:fmt(f),to:fmt(to)}; }
    case 'year': { const f=new Date(t.getFullYear(),0,1); return {from:fmt(f),to:tt}; }
    case 'all': return {from:'2000-01-01',to:'2100-12-31'};
    default: return {from:tt,to:tt};
  }
}

let pageRange = {};
function getPageRange(page,defPreset='month'){
  if(!pageRange[page]) pageRange[page] = {preset:defPreset, ...getRange(defPreset)};
  return pageRange[page];
}
function setRange(page,preset){
  pageRange[page] = {preset, ...getRange(preset)};
  refresh();
}
function setCustomRange(page,from,to){
  pageRange[page] = {preset:'custom',from,to};
  refresh();
}

function filterByDate(arr,page,defPreset='month'){
  const r = getPageRange(page,defPreset);
  return arr.filter(x => x.date >= r.from && x.date <= r.to);
}

function rangeBar(page,defPreset='month'){
  const r = getPageRange(page,defPreset);
  const presets = [
    {k:'today',l:'วันนี้'},{k:'yesterday',l:'เมื่อวาน'},{k:'7d',l:'7 วัน'},
    {k:'30d',l:'30 วัน'},{k:'month',l:'เดือนนี้'},{k:'lastmonth',l:'เดือนที่แล้ว'},
    {k:'year',l:'ปีนี้'},{k:'all',l:'ทั้งหมด'}
  ];
  return `<div class="filter-bar">
    ${presets.map(p=>`<button class="quick-btn ${r.preset===p.k?'active':''}" onclick="setRange('${page}','${p.k}')">${p.l}</button>`).join('')}
    <span class="lbl">|</span>
    <span class="lbl">จาก</span>
    <input type="date" value="${r.from}" onchange="setCustomRange('${page}',this.value,'${r.to}')">
    <span class="lbl">ถึง</span>
    <input type="date" value="${r.to}" onchange="setCustomRange('${page}','${r.from}',this.value)">
  </div>`;
}

let chartInstances = {};

function renderDashCharts(){
  if(!window.Chart) return;
  const isDark = document.body.classList.contains('dark');
  const txt = isDark ? '#e2e8f0' : '#1f2937';
  const grid = isDark ? '#334155' : '#e5e7eb';
  Chart.defaults.color = txt;
  Chart.defaults.borderColor = grid;
  // ทำลายของเก่า
  Object.values(chartInstances).forEach(c=>c?.destroy());
  chartInstances = {};

  // 1) Milk 30 days
  const c1 = $('chartMilk30');
  if(c1){
    const t = new Date();
    const days = [];
    for(let i=29;i>=0;i--){ const d=new Date(t);d.setDate(d.getDate()-i);days.push(d.toISOString().split('T')[0]); }
    const dayTotals = days.map(d => DB.milk.filter(m=>m.date===d).reduce((s,m)=>s+(+m.amount||0),0));
    chartInstances.milk = new Chart(c1, {
      type: 'line',
      data: {
        labels: days.map(d=>d.slice(5)),
        datasets: [{
          label: 'น้ำนม (L)',
          data: dayTotals,
          borderColor: '#16a34a',
          backgroundColor: 'rgba(22,163,74,.1)',
          tension: .3,
          fill: true,
          pointRadius: 3
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {legend:{display:false}},
        scales: {x:{grid:{color:grid}}, y:{grid:{color:grid},beginAtZero:true}}
      }
    });
  }

  // 2) Profit 12 months
  const c2 = $('chartProfit12');
  if(c2){
    const t = new Date();
    const months = [];
    for(let i=11;i>=0;i--){ const d=new Date(t);d.setMonth(d.getMonth()-i);months.push(d.toISOString().slice(0,7)); }
    const profits = months.map(mo=>{
      const milk = DB.milk.filter(m=>m.date.startsWith(mo)).reduce((s,m)=>s+(+m.amount||0),0);
      const milkVal = milk * (DB.settings.milkPrice||0);
      const inc = DB.income.filter(i=>i.date.startsWith(mo)).reduce((s,i)=>s+(+i.amount||0),0);
      const exp = DB.expenses.filter(e=>e.date.startsWith(mo)).reduce((s,e)=>s+(+e.amount||0),0);
      return milkVal + inc - exp;
    });
    chartInstances.profit = new Chart(c2, {
      type: 'bar',
      data: {
        labels: months.map(m=>m.slice(2)),
        datasets: [{
          label: 'กำไร (฿)',
          data: profits,
          backgroundColor: profits.map(p=>p>=0?'#16a34a':'#dc2626')
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {legend:{display:false}},
        scales: {x:{grid:{color:grid}}, y:{grid:{color:grid}}}
      }
    });
  }

  // 3) Expense pie (this month)
  const c3 = $('chartExpPie');
  if(c3){
    const t = new Date();
    const mo = t.toISOString().slice(0,7);
    const byCat = {};
    DB.expenses.filter(e=>e.date.startsWith(mo)).forEach(e=>{
      byCat[e.category] = (byCat[e.category]||0) + (+e.amount||0);
    });
    const cats = Object.keys(byCat);
    const vals = Object.values(byCat);
    if(cats.length){
      const colors = ['#16a34a','#3b82f6','#f59e0b','#dc2626','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#6366f1','#14b8a6','#a855f7'];
      chartInstances.expPie = new Chart(c3, {
        type: 'doughnut',
        data: {
          labels: cats,
          datasets: [{data:vals, backgroundColor:colors.slice(0,cats.length)}]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {legend:{position:'right',labels:{font:{size:11}}}}
        }
      });
    } else {
      c3.parentElement.innerHTML += '<div class="empty"><div class="ic">📭</div>ยังไม่มีรายจ่ายเดือนนี้</div>';
    }
  }
}

function countAlerts(){
  let n = 0;
  // สต็อกต่ำ
  DB.inventory.forEach(i=>{ if(i.minStock && +i.qty < +i.minStock) n++; });
  // ใกล้คลอด
  const today_ = new Date();
  DB.breed.forEach(b=>{
    if(b.expected){
      const exp = new Date(b.expected);
      const diff = (exp - today_)/(1000*60*60*24);
      if(diff>0 && diff<30) n++;
    }
  });
  return n;
}

async function uploadToCloudinary(file){
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', DB.settings.uploadPreset);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${DB.settings.cloudName}/image/upload`, {
    method: 'POST',
    body: formData
  });
  if(!r.ok) throw new Error('Cloudinary upload failed: '+r.status);
  const j = await r.json();
  return j.secure_url;
}

// Resize fallback (base64) - ใช้เมื่อยังไม่ได้ตั้ง Cloudinary
function resizeImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const SMALL = 600; // ย่อให้เล็กถ้าไม่มี Cloudinary
        if(w > SMALL || h > SMALL){
          const ratio = Math.min(SMALL/w, SMALL/h);
          w = Math.round(w*ratio); h = Math.round(h*ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dbSize(){
  try{ return new Blob([JSON.stringify(DB)]).size; }catch(e){ return 0; }
}
function formatBytes(b){
  if(b<1024) return b+' B';
  if(b<1024*1024) return (b/1024).toFixed(1)+' KB';
  return (b/1024/1024).toFixed(2)+' MB';
}

function checkDbCapacity(){
  const size = dbSize();
  if(size > DB_SIZE_LIMIT){
    alert('⚠️ ฐานข้อมูลใกล้เต็ม! ('+formatBytes(size)+'/1 MB)\n\nกรุณาไป ⚙️ ตั้งค่า → "ล้างรูปเก่า" เพื่อลบรูปเก่ากว่า 6 เดือน');
    return false;
  }
  return true;
}

// ลบรูปใบเสร็จเก่ากว่า N เดือน
function cleanOldPhotos(months){
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - months);
  const cutoffStr = cutoff.toISOString().split('T')[0];
  let cleaned = 0;
  let savedBytes = 0;
  DB.expenses.forEach(e=>{
    if(e.date < cutoffStr && e.photos && e.photos.length){
      savedBytes += e.photos.reduce((s,p)=>s+p.length,0);
      cleaned += e.photos.length;
      e.photos = [];
    }
  });
  DB.income.forEach(e=>{
    if(e.date < cutoffStr && e.photos && e.photos.length){
      savedBytes += e.photos.reduce((s,p)=>s+p.length,0);
      cleaned += e.photos.length;
      e.photos = [];
    }
  });
  DB.health.forEach(h=>{
    if(h.date < cutoffStr && h.photos && h.photos.length){
      savedBytes += h.photos.reduce((s,p)=>s+p.length,0);
      cleaned += h.photos.length;
      h.photos = [];
    }
  });
  return {cleaned, savedBytes};
}

function doCleanOld(months){
  if(!confirm(`ลบรูปใบเสร็จ/รูปสุขภาพ ที่เก่ากว่า ${months} เดือน?\n\n(ข้อมูลตัวเลขทั้งหมดจะยังอยู่)`)) return;
  const r = cleanOldPhotos(months);
  log('clean-photos', `ลบ ${r.cleaned} รูป (ประหยัด ${formatBytes(r.savedBytes)})`);
  save();
  alert(`✅ ลบ ${r.cleaned} รูปแล้ว\nประหยัดพื้นที่: ${formatBytes(r.savedBytes)}`);
  refresh();
}

async function addPhotos(files){
  if(!files || !files.length) return;
  if(tempPhotos.length + files.length > MAX_PHOTOS){
    alert(`ใส่รูปได้สูงสุด ${MAX_PHOTOS} รูปต่อรายการ (เหลือ ${MAX_PHOTOS-tempPhotos.length})`);
    return;
  }
  const useCloud = isCloudinaryReady();
  if(!useCloud && !checkDbCapacity()) return;
  uploadingPhoto = true;
  renderPhotoThumbs();
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    try{
      if(useCloud){
        const url = await uploadToCloudinary(f);
        tempPhotos.push(url);
      } else {
        const data = await resizeImage(f);
        tempPhotos.push(data);
      }
      renderPhotoThumbs();
    }catch(e){
      console.error('upload err',e);
      alert('อัปโหลดรูปไม่สำเร็จ: '+e.message+'\n\nตรวจ Cloudinary settings ในหน้าตั้งค่า');
    }
  }
  uploadingPhoto = false;
  renderPhotoThumbs();
}

function renderPhotoThumbs(){
  const el = $('photoThumbs');
  if(!el) return;
  el.innerHTML = tempPhotos.map((p,i)=>`
    <div class="photo-thumb">
      <img src="${p}" onclick="openLightbox('${i}')">
      <button class="del-btn" onclick="removePhoto(${i})" title="ลบ">×</button>
    </div>`).join('') + (uploadingPhoto?'<div class="photo-thumb" style="display:flex;align-items:center;justify-content:center;color:#16a34a;font-size:11px">⏳ กำลังอัปโหลด...</div>':'');
}

function removePhoto(i){
  tempPhotos.splice(i,1);
  renderPhotoThumbs();
}

function openLightbox(src){
  // ถ้าเป็น index ของ tempPhotos
  let url = src;
  if(/^\d+$/.test(src)) url = tempPhotos[+src];
  let lb = $('lightbox');
  if(!lb){
    lb = document.createElement('div');
    lb.id = 'lightbox'; lb.className = 'lightbox';
    lb.innerHTML = '<button class="close-btn" onclick="closeLightbox()">×</button><img>';
    lb.addEventListener('click', e=>{ if(e.target===lb) closeLightbox(); });
    document.body.appendChild(lb);
  }
  lb.querySelector('img').src = url;
  lb.classList.add('show');
}
function closeLightbox(){ $('lightbox')?.classList.remove('show'); }

  if(!token || !chatId){
    console.warn('Telegram not configured');
    return {ok:false, error:'ยังไม่ได้ตั้งค่า Telegram'};
  }
  try{
    const r = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: chatId, text, parse_mode: 'HTML', disable_web_page_preview: true})
    });
    const j = await r.json();
    return j;
  }catch(e){
    return {ok:false, error: e.message};
  }
}

// ============== Auto-Backup to Telegram ==============
// ส่งไฟล์ JSON ของฟาร์มไปแชท Telegram ทุก 7 วัน (และตอนกดเอง)
async function runBackupNow(silent){
  const token = DB.settings.telegramBotToken;
  const chatId = DB.settings.telegramChatId;
  if(!token || !chatId){
    if(!silent) showToast('ต้องตั้งค่า Telegram ก่อน','error');
    return false;
  }
  try{
    if(!silent) showToast('กำลังสำรอง...','info');
    // สร้างไฟล์ backup โดยตัด voiceMemo ออก (ไฟล์เล็กลง)
    const backupData = JSON.parse(JSON.stringify(DB));
    if(backupData.health) backupData.health.forEach(h=>{ if(h.voiceMemo) h.voiceMemo='[audio omitted]'; });
    const json = JSON.stringify(backupData, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const farmName = (DB.settings.farmName||'farm').replace(/[^a-zA-Z0-9ก-๙]/g,'_');
    const date = new Date().toISOString().slice(0,10);
    const filename = `farmmeth_backup_${farmName}_${date}.json`;

    const form = new FormData();
    form.append('chat_id', chatId);
    form.append('document', blob, filename);
    form.append('caption', `🐄 *FarmMeth Auto-Backup*\n📅 ${new Date().toLocaleString('th-TH')}\n🏠 ${DB.settings.farmName||'ฟาร์ม'}\n📊 วัว ${(DB.cows||[]).length} ตัว · น้ำนม ${(DB.milk||[]).length} รายการ`);
    form.append('parse_mode', 'Markdown');

    const r = await fetch(`https://api.telegram.org/bot${token}/sendDocument`, {method:'POST', body: form});
    const j = await r.json();
    if(j.ok){
      DB.settings.lastTelegramBackup = new Date().toISOString();
      save();
      if(!silent) showToast('สำรองสำเร็จ! ดูใน Telegram ได้เลย','success', 5000);
      log('backup-tg','สำรองข้อมูลไป Telegram สำเร็จ');
      return true;
    } else {
      if(!silent) showToast('สำรองล้มเหลว: '+(j.description||'unknown'),'error');
      console.error('Backup failed:', j);
      return false;
    }
  }catch(e){
    console.error('Backup error:', e);
    if(!silent) showToast('สำรองล้มเหลว: '+e.message,'error');
    return false;
  }
}

// เช็คครั้งเดียวตอน app boot — สำรองถ้าผ่าน 7 วันแล้ว
function checkAutoBackup(){
  if(!DB.settings.autoBackupEnabled) return;
  if(!DB.settings.telegramBotToken || !DB.settings.telegramChatId) return;
  if(currentUser.role !== 'owner') return; // เฉพาะ Owner
  const last = DB.settings.lastTelegramBackup;
  if(last){
    const daysSince = (Date.now() - new Date(last).getTime()) / (1000*60*60*24);
    if(daysSince < 7) return; // ยังไม่ถึง 7 วัน
  }
  // ผ่าน 7 วันแล้ว (หรือยังไม่เคย backup) → ส่ง
  runBackupNow(true);
}

// ============== Voice Memo (MediaRecorder API) ==============
// อัดเสียงบันทึก → เก็บ base64 ใน DB → เล่นซ้ำได้
let _vmRecorder = null;
let _vmChunks = [];
let _vmStartTime = 0;
let _vmTargetField = '';

async function vmStart(targetFieldId){
  if(!navigator.mediaDevices || !window.MediaRecorder){
    showToast('เบราเซอร์ไม่รองรับการอัดเสียง','error');
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    _vmTargetField = targetFieldId;
    _vmChunks = [];
    _vmStartTime = Date.now();
    // ใช้ mimetype ที่เบราเซอร์รองรับ
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
               : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
               : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
               : '';
    _vmRecorder = new MediaRecorder(stream, mime?{mimeType:mime}:{});
    _vmRecorder.ondataavailable = e => { if(e.data && e.data.size) _vmChunks.push(e.data); };
    _vmRecorder.onstop = async () => {
      const blob = new Blob(_vmChunks, {type: _vmRecorder.mimeType || 'audio/webm'});
      // ตรวจขนาด (จำกัด 2MB ~ ประมาณ 2 นาที)
      if(blob.size > 2*1024*1024){
        showToast('ไฟล์เสียงใหญ่เกินไป (>2MB) ลองอัดสั้นลง','error');
        stream.getTracks().forEach(t=>t.stop());
        return;
      }
      // แปลงเป็น base64
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64 = reader.result;
        const duration = Math.round((Date.now()-_vmStartTime)/1000);
        const targetEl = document.getElementById(_vmTargetField);
        if(targetEl){
          targetEl.value = JSON.stringify({data:base64, duration, mime: blob.type, recorded: new Date().toISOString()});
          // อัพเดท preview
          const preview = document.getElementById(_vmTargetField+'_preview');
          if(preview){
            preview.innerHTML = `<audio controls src="${base64}" style="height:32px;max-width:100%"></audio> <span style="font-size:12px;color:#6b7280">${duration} วินาที</span> <button type="button" class="btn btn-sec btn-sm" onclick="vmClear('${_vmTargetField}')">🗑️ ลบ</button>`;
          }
          showToast(`บันทึกเสียงเรียบร้อย (${duration}s)`,'success');
        }
      };
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t=>t.stop());
    };
    _vmRecorder.start();
    // อัพเดทปุ่ม
    const btn = document.getElementById(targetFieldId+'_btn');
    if(btn){
      btn.innerHTML = '⏹️ หยุดอัด';
      btn.classList.add('btn-danger');
      btn.classList.remove('btn-sec');
      btn.onclick = ()=>vmStop();
    }
    // แสดงตัวจับเวลา
    const timer = document.getElementById(targetFieldId+'_timer');
    if(timer){
      timer.style.display='inline-block';
      timer.innerHTML = '🔴 0:00';
      window._vmTimerInt = setInterval(()=>{
        const sec = Math.floor((Date.now()-_vmStartTime)/1000);
        timer.innerHTML = `🔴 ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
        if(sec >= 120){ vmStop(); } // จำกัดสูงสุด 2 นาที
      }, 500);
    }
  }catch(e){
    console.error('Voice record error:', e);
    showToast('ไม่สามารถเข้าถึงไมโครโฟน — โปรดให้สิทธิ์','error');
  }
}

function vmStop(){
  if(_vmRecorder && _vmRecorder.state !== 'inactive'){
    _vmRecorder.stop();
  }
  if(window._vmTimerInt){ clearInterval(window._vmTimerInt); window._vmTimerInt=null; }
  // คืนปุ่มเริ่ม
  const btn = document.getElementById(_vmTargetField+'_btn');
  if(btn){
    btn.innerHTML = '🎤 อัดเสียง';
    btn.classList.remove('btn-danger');
    btn.classList.add('btn-sec');
    btn.onclick = ()=>vmStart(_vmTargetField);
  }
  const timer = document.getElementById(_vmTargetField+'_timer');
  if(timer) timer.style.display='none';
}

function vmClear(targetFieldId){
  const el = document.getElementById(targetFieldId);
  if(el) el.value = '';
  const preview = document.getElementById(targetFieldId+'_preview');
  if(preview) preview.innerHTML = '<span style="color:#9ca3af;font-size:13px">ยังไม่มีเสียง</span>';

// ============== Smart Reminder + AI Insight ==============
function generateReminders(){
  const reminders = [];
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);

  // 1. Vaccine due (DB.health มี followUp date)
  (DB.health||[]).forEach(h=>{
    if(h.followUp){
      const days = Math.floor((new Date(h.followUp)-today)/(1000*60*60*24));
      if(days>=0 && days<=3) reminders.push({type:'health', urgency: days<=1?'high':'medium', msg:`💉 นัดตรวจ/ฉีดวัคซีน: ${cowName(h.cowId)} ${days===0?'วันนี้':'อีก '+days+' วัน'}`});
    }
  });

  // 2. Breeding/Calving due
  (DB.breed||[]).forEach(b=>{
    if(b.expected && !b.actualBirth){
      const days = Math.floor((new Date(b.expected)-today)/(1000*60*60*24));
      if(days>=-3 && days<=14) reminders.push({type:'breed', urgency: days<=3?'high':'medium', msg:`🤰 ใกล้คลอด: ${cowName(b.cowId)} ${days<0?'(เลย '+Math.abs(days)+' วัน)':'อีก '+days+' วัน'}`});
    }
  });

  // 3. Heat cycle 21 days
  (DB.heats||[]).forEach(h=>{
    const next = new Date(h.date); next.setDate(next.getDate()+21);
    const days = Math.floor((next-today)/(1000*60*60*24));
    if(days>=0 && days<=2) reminders.push({type:'heat', urgency:'medium', msg:`🔥 คาดสัดถัดไป: ${cowName(h.cowId)} ${days===0?'วันนี้':'อีก '+days+' วัน'}`});
  });

  // 4. Stock low
  (DB.inventory||[]).forEach(i=>{
    if(i.minStock && +i.qty < +i.minStock){
      reminders.push({type:'stock', urgency:'medium', msg:`📦 สต็อกต่ำ: ${i.name} (เหลือ ${i.qty} ${i.unit||''}/${i.minStock})`});
    }
  });

  return reminders;
}

function generateInsights(){
  const insights = [];
  const today = new Date();
  const last7 = new Date(today); last7.setDate(today.getDate()-7);
  const prev7 = new Date(last7); prev7.setDate(last7.getDate()-7);
  const last3 = new Date(today); last3.setDate(today.getDate()-3);

  // 1. Milk drop detection per cow (last 3 vs prev 7 avg)
  const lactCows = (DB.cows||[]).filter(c=>c.status==='lactating');
  lactCows.forEach(c=>{
    const last3Milk = (DB.milk||[]).filter(m=>m.cowId===c.id && new Date(m.date)>=last3);
    const prev7Milk = (DB.milk||[]).filter(m=>m.cowId===c.id && new Date(m.date)<last3 && new Date(m.date)>=prev7);
    if(prev7Milk.length>=3 && last3Milk.length>=2){
      const last3Avg = last3Milk.reduce((s,m)=>s+(+m.amount||0),0) / 3;
      const prev7Avg = prev7Milk.reduce((s,m)=>s+(+m.amount||0),0) / 7;
      if(prev7Avg>1 && last3Avg < prev7Avg * 0.8){
        const drop = Math.round((1-last3Avg/prev7Avg)*100);
        insights.push({type:'milkDrop', urgency:'high', msg:`📉 ${c.code} ${c.name||''}: น้ำนมลด ${drop}% ติดต่อกัน 3 วัน — ลองตรวจสุขภาพ/อาหาร`});
      }
    }
  });

  // 2. No health record in 30 days
  (DB.cows||[]).forEach(c=>{
    if(c.status==='lactating' || c.status==='dry'){
      const lastHealth = (DB.health||[]).filter(h=>h.cowId===c.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
      const lastDate = lastHealth ? new Date(lastHealth.date) : (c.birth?new Date(c.birth):today);
      const days = Math.floor((today-lastDate)/(1000*60*60*24));
      if(days>60) insights.push({type:'noHealth', urgency:'low', msg:`🩺 ${c.code} ${c.name||''}: ไม่มีบันทึกสุขภาพ ${days} วัน — ควรตรวจ`});
    }
  });

  // 3. Cost spike (monthly expense > 120% of avg)
  const thisMonth = today.toISOString().slice(0,7);
  const lastMonth = new Date(today.getFullYear(), today.getMonth()-1, 1).toISOString().slice(0,7);
  const thisM = (DB.expenses||[]).filter(e=>e.date && e.date.startsWith(thisMonth)).reduce((s,e)=>s+(+e.amount||0),0);
  const lastM = (DB.expenses||[]).filter(e=>e.date && e.date.startsWith(lastMonth)).reduce((s,e)=>s+(+e.amount||0),0);
  if(lastM>1000 && thisM > lastM*1.2){
    const inc = Math.round((thisM/lastM-1)*100);
    insights.push({type:'costSpike', urgency:'medium', msg:`💸 ค่าใช้จ่ายเดือนนี้สูงกว่าเดือนก่อน ${inc}% (฿${thisM.toLocaleString('th-TH')} vs ฿${lastM.toLocaleString('th-TH')})`});
  }

  // 4. Pregnancy rate
  const breedRecords = (DB.breed||[]).filter(b=>{
    const d = new Date(b.date);
    return today-d < 1000*60*60*24*180; // 6 months
  });
  if(breedRecords.length>=5){
    const confirmed = breedRecords.filter(b=>b.confirmed || b.actualBirth).length;
    const rate = Math.round(confirmed/breedRecords.length*100);
    if(rate < 50) insights.push({type:'lowPregnancy', urgency:'low', msg:`📊 อัตราการผสมติด 6 เดือนล่าสุด: ${rate}% (ต่ำกว่าเกณฑ์ 50%)`});
  }

  return insights;
}

// ============== Toast Notification ==============
function showToast(msg, type='info', duration=3500){
  // type: info | success | warn | error
  const icons = {info:'ℹ️', success:'✅', warn:'⚠️', error:'❌', alert:'🔔'};
  let stack = document.getElementById('toastStack');
  if(!stack){
    stack = document.createElement('div');
    stack.id = 'toastStack';
    stack.className = 'toast-stack';
    document.body.appendChild(stack);
  }
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span class="toast-icon">${icons[type]||'ℹ️'}</span><span class="toast-msg">${msg}</span><button class="toast-x" onclick="this.parentElement.remove()">×</button>`;
  stack.appendChild(el);
  // Beep for warn/error/alert
  if(type==='warn' || type==='error' || type==='alert') playBeep(type);
  setTimeout(()=>{ el.classList.add('toast-fade'); setTimeout(()=>el.remove(), 300); }, duration);
}

// Web Audio API beep
let _audioCtx = null;
function playBeep(type='info'){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = _audioCtx;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    const freq = {error:200, warn:400, alert:600, success:800, info:500}[type] || 500;
    o.frequency.value = freq;
    o.type = 'sine';
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4);
    o.start();
    o.stop(ctx.currentTime + 0.4);
    if(type==='alert' || type==='error'){
      // beep 2 ครั้ง
      setTimeout(()=>{ const o2=ctx.createOscillator(); const g2=ctx.createGain(); o2.connect(g2); g2.connect(ctx.destination); o2.frequency.value=freq; o2.type='sine'; g2.gain.setValueAtTime(0.0001, ctx.currentTime); g2.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02); g2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4); o2.start(); o2.stop(ctx.currentTime + 0.4); }, 500);
    }
  }catch(e){}
}

function checkEveningCompletion(){
  const d = today();
  const lactCows = DB.cows.filter(c=>c.status==='lactating');
  if(!lactCows.length) return;

function buildDailySummary(d){
  d = d || today();
  const dThai = new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});
  const milkToday = DB.milk.filter(m=>m.date===d);
  const totalMilk = milkToday.reduce((s,m)=>s+(+m.amount||0),0);
  const totalValue = totalMilk * (DB.settings.milkPrice||0);
  const expToday = DB.expenses.filter(e=>e.date===d).reduce((s,e)=>s+(+e.amount||0),0);
  const incToday = DB.income.filter(i=>i.date===d).reduce((s,i)=>s+(+i.amount||0),0);
  const profit = (totalValue + incToday) - expToday;

  // รายตัว
  const lactCows = DB.cows.filter(c=>c.status==='lactating');
  const perCow = lactCows.map(c=>{
    const m = milkToday.filter(x=>x.cowId===c.id);
    const total = m.reduce((s,x)=>s+(+x.amount||0),0);
    const morn = m.find(x=>x.session==='morning');
    const eve = m.find(x=>x.session==='evening');
    return `• ${c.code} ${c.name||''}: <b>${total.toFixed(2)} L</b>${morn?' (เช้า '+(+morn.amount).toFixed(2):''}${eve?' + เย็น '+(+eve.amount).toFixed(2)+')':''}`;
  }).join('\n');

  // แจ้งเตือน
  const alerts = [];
  const t = new Date();
  DB.breed.forEach(b=>{
    if(b.expected && !b.actualBirth){
      const days = Math.floor((new Date(b.expected)-t)/(1000*60*60*24));
      if(days>=0 && days<=30) alerts.push(`🤰 ใกล้คลอด: ${cowName(b.cowId)} (อีก ${days} วัน)`);
    }
  });
  DB.inventory.forEach(i=>{
    if(i.minStock && +i.qty < +i.minStock){
      alerts.push(`📦 สต็อกต่ำ: ${i.name} (เหลือ ${i.qty} ${i.unit||''})`);
    }
  });
  DB.health.forEach(h=>{
    if(h.followUp){
      const days = Math.floor((new Date(h.followUp)-t)/(1000*60*60*24));
      if(days>=0 && days<=3) alerts.push(`💉 นัดตรวจ: ${cowName(h.cowId)} (อีก ${days} วัน)`);
    }
  });

  return `🐄 <b>${DB.settings.farmName||'ฟาร์มวัวนม'}</b>\nสรุปวันที่ ${dThai}\n\n🥛 น้ำนมวันนี้: <b>${totalMilk.toFixed(2)} L</b>\n💰 มูลค่าน้ำนม: <b>฿${totalValue.toLocaleString('th-TH',{maximumFractionDigits:2})}</b> (${DB.settings.milkPrice||0}/L)\n\n📊 รายตัว:\n${perCow||'(ไม่มีบันทึก)'}\n\n💸 รายจ่ายวันนี้: ฿${expToday.toLocaleString('th-TH')}\n💵 รายรับอื่น: ฿${incToday.toLocaleString('th-TH')}\n💎 กำไรประมาณ: <b>฿${profit.toLocaleString('th-TH',{maximumFractionDigits:2})}</b>\n${alerts.length ? '\n🔔 ที่ต้องระวัง:\n'+alerts.join('\n') : ''}\n\nบันทึกโดย ${currentUser.name}`;
}

// ============== LINE Messaging API ==============
// LINE ไม่รองรับ HTML — ต้องแปลง <b>...</b> เป็น plain text ก่อนส่ง
function stripHtml(s){
  return (s||'').replace(/<b>|<\/b>|<i>|<\/i>|<u>|<\/u>|<code>|<\/code>/g,'')
                .replace(/<br\s*\/?>/g,'\n')
                .replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
}

// LINE API block CORS — ต้องเรียกผ่าน Cloudflare Worker proxy
const LINE_PROXY_URL = 'https://farmmeth-line-proxy.keatikoon.workers.dev/';

async function sendLine(text){
  const token = DB.settings.lineChannelToken;
  const userId = DB.settings.lineUserId;
  if(!token || !userId){
    return {ok:false, error:'ยังไม่ได้ตั้งค่า LINE'};
  }
  const plainText = stripHtml(text).substring(0, 4900); // LINE max 5000 chars
  try{
    const r = await fetch(LINE_PROXY_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        token: token,
        to: userId,
        text: plainText
      })
    });
    if(r.status === 200) return {ok:true};
    const j = await r.json().catch(()=>({}));
    return {ok:false, status:r.status, error: j.message || j.error || ('HTTP '+r.status), details: j.details};
  }catch(e){
    return {ok:false, error: e.message};
  }
}

function addDays(dateStr,days){
  const d = new Date(dateStr); d.setDate(d.getDate()+days);
  return d.toISOString().split('T')[0];
}

  };
  if(!data.cowId){ alert('กรุณาเลือกวัว'); return; }
  if(!data.expected && data.date) data.expected = addDays(data.date,280);

function saveEmp(id){
  if(!id && !checkPlanLimit('employee')) return;
  const username = ($('f_username').value||'').trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'');
  const password = ($('f_password').value||'').trim();
  const permissions = Array.from(document.querySelectorAll('.perm-cb:checked')).map(c=>c.value);
  const data = {
    name:$('f_name').value.trim(),
    idCard:$('f_idc').value.trim(),
    position:$('f_pos').value.trim(),
    wageType:$('f_wtype').value,
    wage:+$('f_wage').value||0,
    pin:$('f_pin').value.trim(),
    username: username,
    password: password,
    active: $('f_active').value === '1',
    permissions: permissions
  };
  if(!data.name){ alert('กรุณากรอกชื่อพนักงาน'); return; }
  // ตรวจ username/password
  if(data.username){
    if(data.username.length < 3){ alert('Username ต้องอย่างน้อย 3 ตัวอักษร'); return; }
    if(!data.password || data.password.length < 4){ alert('Password ต้องอย่างน้อย 4 ตัวอักษร'); return; }
    // ตรวจ username ซ้ำ
    const dup = DB.employees.find(e=>e.username===data.username && e.id!==id);
    if(dup){ alert('Username นี้ใช้แล้วโดย ' + dup.name); return; }
  }
  if(id){
    Object.assign(DB.employees.find(x=>x.id===id), data);
    log('edit-emp', data.name);
  } else {
    data.id = uid();
    DB.employees.push(data);
    log('add-emp', data.name);
  }
  save(); closeModal(); refresh();
}

function delEmp(id){
  if(!confirm('ลบพนักงานนี้?')) return;
  DB.employees = DB.employees.filter(x=>x.id!==id);
  log('del-emp','ลบพนักงาน');
  save(); closeModal(); refresh();
}

    </div>

      <button class="btn btn-primary" onclick="savePay()">💾 บันทึก</button>

function calcPay(){
  const eid = $('f_emp').value;
  const e = DB.employees.find(x=>x.id===eid);
  const days = +$('f_days').value || 0;
  if(e){
    let base = 0;
    if(e.wageType==='monthly') base = e.wage;
    else if(e.wageType==='daily') base = e.wage * days;
    else if(e.wageType==='hourly') base = e.wage * days;
    $('f_base').value = base.toFixed(2);
    // SSO 5% capped at 750
    const sso = Math.min(base*0.05, 750);
    $('f_sso').value = sso.toFixed(2);
  }
  const base = +$('f_base').value||0, ot = +$('f_ot').value||0, bonus = +$('f_bonus').value||0,
        deduct = +$('f_deduct').value||0, sso = +$('f_sso').value||0;
  $('f_net').value = (base+ot+bonus-deduct-sso).toFixed(2);
}

function savePay(){
  const eid = $('f_emp').value;
  const e = DB.employees.find(x=>x.id===eid);
  if(!e){ alert('กรุณาเลือกพนักงาน'); return; }
  const data = {
    id:uid(), period:$('f_period').value, empId:eid, empName:e.name,
    days:+$('f_days').value||0,
    base:+$('f_base').value||0, ot:+$('f_ot').value||0, bonus:+$('f_bonus').value||0,
    deduct:+$('f_deduct').value||0, sso:+$('f_sso').value||0, net:+$('f_net').value||0
  };
  DB.payroll.push(data);
  // auto expense
  DB.expenses.push({id:uid(),date:today(),category:'ค่าจ้าง/ค่าแรง',amount:data.net,note:'ค่าแรง '+e.name+' งวด '+data.period,recordedBy:currentUser.name});
  log('add-pay', e.name+' '+money(data.net));
  save(); closeModal(); refresh();
}

function delPay(id){
  if(!confirm('ลบค่าแรงนี้?')) return;
  DB.payroll = DB.payroll.filter(x=>x.id!==id);
  log('del-pay','ลบค่าแรง');
  save(); refresh();
}
