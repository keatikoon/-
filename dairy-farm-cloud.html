function clockIn(){
  const now = new Date();
  const t = {id:uid(), empName:currentUser.name, date:today(), in:now.toTimeString().slice(0,5), out:null, hours:null};
  DB.timeclock.push(t);
  log('clock-in','ลงเวลาเข้างาน');
  save(); refresh();
}

function clockOut(){
  const rec = DB.timeclock.find(t=>t.empName===currentUser.name && t.date===today() && !t.out);
  if(!rec) return;
  const now = new Date();
  rec.out = now.toTimeString().slice(0,5);
  const [h1,m1] = rec.in.split(':').map(Number);
  const [h2,m2] = rec.out.split(':').map(Number);
  rec.hours = ((h2*60+m2) - (h1*60+m1))/60;
  log('clock-out','ลงเวลาออกงาน '+rec.hours.toFixed(2)+' ชม.');
  save(); refresh();
}

// ================== CALENDAR ==================
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();

function renderCal(){
  const events = collectEvents();
  const first = new Date(calYear, calMonth, 1);
  const last = new Date(calYear, calMonth+1, 0);
  const startWeekday = first.getDay();
  const daysInMonth = last.getDate();
  const monthName = first.toLocaleDateString('th-TH',{month:'long',year:'numeric'});
  const t = new Date();
  const todayStr = t.toISOString().split('T')[0];

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += '<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ds = new Date(calYear,calMonth,d).toISOString().split('T')[0];
    const dayEvents = events.filter(e=>e.date===ds);
    cells += `<div class="cal-day ${ds===todayStr?'today':''}">
      <div class="cal-num">${d}</div>
      ${dayEvents.slice(0,3).map(e=>`<div class="cal-event ${e.color||''}" title="${e.title}">${e.title}</div>`).join('')}
      ${dayEvents.length>3?`<div class="muted">+${dayEvents.length-3} อื่น</div>`:''}
    </div>`;
  }

  $('pageContent').innerHTML = `
    <div class="page-head">
      <div class="page-title">📅 ปฏิทินงาน</div>
    </div>
    <div class="cal">
      <div class="cal-head">
        <button class="btn btn-sec" onclick="calPrev()">← ก่อนหน้า</button>
        <h3>${monthName}</h3>
        <button class="btn btn-sec" onclick="calNext()">ถัดไป →</button>
      </div>
      <div class="cal-grid">
        ${['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div class="cal-day-head">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>`;
}

function calPrev(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} refresh(); }
function calNext(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} refresh(); }

function collectEvents(){
  const events = [];
  // คาดคลอด
  DB.breed.forEach(b=>{
    if(b.expected && !b.actualBirth){
      events.push({date:b.expected, title:'คาดคลอด '+cowName(b.cowId), color:'blue'});
    }
  });
  // นัดติดตามสุขภาพ
  DB.health.forEach(h=>{
    if(h.followUp){
      events.push({date:h.followUp, title:'นัดตรวจ '+cowName(h.cowId), color:'red'});
    }
  });
  // งานที่มอบหมาย
  DB.tasks.forEach(t=>{
    if(t.due && !t.done){
      events.push({date:t.due, title:'งาน: '+t.title, color:'green'});
    }
  });
  return events;
}

function renderAlerts(){
  const alerts = [];
  // สต็อกต่ำ
  DB.inventory.forEach(i=>{
    if(i.minStock && +i.qty < +i.minStock){
      alerts.push({urgent:true,ic:'📦',title:'สต็อกใกล้หมด: '+i.name,desc:'เหลือ '+i.qty+' '+(i.unit||'')+' (ขั้นต่ำ '+i.minStock+')'});
    }
  });
  // ใกล้คลอด
  const t = new Date();
  DB.breed.forEach(b=>{
    if(b.expected && !b.actualBirth){
      const exp = new Date(b.expected);
      const diff = Math.floor((exp-t)/(1000*60*60*24));
      if(diff>=0 && diff<=30){
        alerts.push({urgent:diff<=7,ic:'🤰',title:'ใกล้คลอด: '+cowName(b.cowId),desc:'เหลือ '+diff+' วัน ('+b.expected+')'});
      }
    }
  });
  // นัดติดตาม
  DB.health.forEach(h=>{
    if(h.followUp){
      const f = new Date(h.followUp);
      const diff = Math.floor((f-t)/(1000*60*60*24));
      if(diff>=-1 && diff<=7){
        alerts.push({urgent:diff<=0,ic:'💉',title:'นัดตรวจ: '+cowName(h.cowId),desc:h.type+' '+h.followUp});
      }
    }
  });
  // backup เตือน
  if(currentUser.role==='owner' && DB.settings.lastBackup){
    const last = new Date(DB.settings.lastBackup);
    const diffDay = Math.floor((t-last)/(1000*60*60*24));
    if(diffDay>30) alerts.push({urgent:false,ic:'💾',title:'ควรสำรองข้อมูล',desc:'ไม่ได้สำรอง '+diffDay+' วันแล้ว'});
  }

  $('pageContent').innerHTML = `
    <div class="page-head">
      <div class="page-title">🔔 การแจ้งเตือน (${alerts.length})</div>
    </div>
    ${alerts.length ? alerts.map(a=>`
      <div class="alert-item ${a.urgent?'urgent':''}">
        <span class="ic">${a.ic}</span>
        <div class="body">
          <div class="ttl">${a.title}</div>
          <div class="desc">${a.desc}</div>
        </div>
      </div>
    `).join('') : '<div class="empty"><div class="ic">😊</div>ไม่มีการแจ้งเตือน</div>'}`;
}

  // กำไรรายตัว

// ================== KPI ==================
function renderKpi(){
  const lactCows = DB.cows.filter(c=>c.status==='lactating');
  const t = new Date();

  // DIM avg
  const dims = lactCows.filter(c=>c.calveDate).map(c=>(t-new Date(c.calveDate))/(1000*60*60*24));
  const avgDIM = dims.length ? dims.reduce((s,d)=>s+d,0)/dims.length : 0;

  // Milk per cow per day (last 7 days)
  const r7 = getRange('7d');
  const m7 = DB.milk.filter(m=>m.date>=r7.from && m.date<=r7.to);
  const milkPerCowDay = lactCows.length ? m7.reduce((s,m)=>s+(+m.amount||0),0)/(lactCows.length*7) : 0;

  // Pregnancy rate
  const totalAI = DB.breed.length;
  const pregnant = DB.breed.filter(b=>b.result==='ติด').length;
  const pregRate = totalAI ? (pregnant/totalAI*100) : 0;

  // Quality avg
  const fats = m7.filter(m=>m.fat).map(m=>+m.fat);
  const pros = m7.filter(m=>m.protein).map(m=>+m.protein);
  const avgFat = fats.length ? fats.reduce((s,f)=>s+f,0)/fats.length : 0;
  const avgPro = pros.length ? pros.reduce((s,p)=>s+p,0)/pros.length : 0;

  // Calving interval (avg gap between calveDates)
  const calvings = DB.breed.filter(b=>b.actualBirth).map(b=>b.actualBirth).sort();
  let avgCI = 0;
  if(calvings.length>1){
    let totalDays = 0;
    for(let i=1;i<calvings.length;i++) totalDays += (new Date(calvings[i])-new Date(calvings[i-1]))/(1000*60*60*24);
    avgCI = totalDays/(calvings.length-1);
  }

  $('pageContent').innerHTML = `
    <div class="page-head">
      <div class="page-title">📐 KPI ปศุสัตว์</div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-label">DIM เฉลี่ย</div><div class="stat-value">${avgDIM.toFixed(0)}</div><div class="stat-sub">วัน (Days In Milk)</div></div>
      <div class="stat blue"><div class="stat-label">น้ำนม/วัว/วัน</div><div class="stat-value">${milkPerCowDay.toFixed(1)} L</div><div class="stat-sub">เฉลี่ย 7 วันล่าสุด</div></div>
      <div class="stat amber"><div class="stat-label">อัตราตั้งท้อง</div><div class="stat-value">${pregRate.toFixed(1)}%</div><div class="stat-sub">${pregnant}/${totalAI} ครั้ง</div></div>
      <div class="stat purple"><div class="stat-label">Calving Interval</div><div class="stat-value">${avgCI.toFixed(0)}</div><div class="stat-sub">วันเฉลี่ยระหว่างคลอด</div></div>
      <div class="stat"><div class="stat-label">ไขมัน% เฉลี่ย</div><div class="stat-value">${avgFat.toFixed(2)}%</div></div>
      <div class="stat"><div class="stat-label">โปรตีน% เฉลี่ย</div><div class="stat-value">${avgPro.toFixed(2)}%</div></div>
      <div class="stat blue"><div class="stat-label">วัวให้นม</div><div class="stat-value">${lactCows.length}</div></div>
      <div class="stat amber"><div class="stat-label">วัวตั้งท้อง</div><div class="stat-value">${DB.cows.filter(c=>c.status==='pregnant').length}</div></div>
    </div>`;
}

function exportData(){
  const data = JSON.stringify(DB,null,2);
  const blob = new Blob([data],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'dairy-farm-'+today()+'.json'; a.click();
  URL.revokeObjectURL(url);
  DB.settings.lastBackup = new Date().toISOString();
  save();
}

// ============== EXPORT EXCEL ==============
function exportExcel(){
  if(!window.XLSX){ alert('กำลังโหลด Excel library... รอสักครู่แล้วลองใหม่'); return; }
  const wb = XLSX.utils.book_new();
  const cowMap = {};
  DB.cows.forEach(c=>cowMap[c.id] = c.code+' '+(c.name||''));

  // 1) Cows
  const cows = DB.cows.map(c=>({
    'รหัส': c.code,
    'ชื่อ': c.name||'',
    'สายพันธุ์': c.breed||'',
    'วันเกิด': c.birth||'',
    'อายุ (ปี)': c.birth?Number(ageYears(c.birth)):'',
    'น้ำหนัก (กก.)': c.weight||0,
    'สถานะ': statusLabel(c.status),
    'Lactation รอบที่': c.lactation||1,
    'วันคลอดล่าสุด': c.calveDate||'',
    'จำนวนรูป': (c.photos||[]).length,
    'หมายเหตุ': c.notes||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cows), 'วัวในฟาร์ม');

  // 2) Milk
  const milk = DB.milk.sort((a,b)=>b.date.localeCompare(a.date)).map(m=>({
    'วันที่': m.date,
    'วัว': cowMap[m.cowId]||m.cowId,
    'รอบ': m.session==='morning'?'เช้า':'เย็น',
    'ปริมาณ (L)': +m.amount||0,
    'มูลค่า (฿)': (+m.amount||0) * (DB.settings.milkPrice||0),
    'ไขมัน %': m.fat||'',
    'โปรตีน %': m.protein||'',
    'บันทึกโดย': m.recordedBy||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(milk), 'บันทึกน้ำนม');

  // 3) Feed
  const feed = DB.feed.sort((a,b)=>b.date.localeCompare(a.date)).map(f=>({
    'วันที่': f.date,
    'วัว/ฝูง': f.cowId?(cowMap[f.cowId]||f.cowId):'ทั้งฝูง',
    'ประเภทอาหาร': f.type,
    'ปริมาณ': +f.qty||0,
    'หน่วย': f.unit||'',
    'ราคา/หน่วย': +f.price||0,
    'ค่าใช้จ่าย (฿)': +f.cost||0,
    'บันทึกโดย': f.recordedBy||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(feed), 'อาหาร');

  // 4) Health
  const health = DB.health.sort((a,b)=>b.date.localeCompare(a.date)).map(h=>({
    'วันที่': h.date,
    'วัว': cowMap[h.cowId]||h.cowId,
    'ประเภท': h.type,
    'รายละเอียด': h.detail||'',
    'หยุดยา (วัน)': h.withdrawDays||0,
    'นัดติดตาม': h.followUp||'',
    'ค่าใช้จ่าย (฿)': +h.cost||0,
    'บันทึกโดย': h.recordedBy||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(health), 'สุขภาพ');

  // 5) Breeding
  const breed = DB.breed.sort((a,b)=>b.date.localeCompare(a.date)).map(b=>({
    'วันผสม': b.date,
    'วัว': cowMap[b.cowId]||b.cowId,
    'วิธี': b.method||'AI',
    'พ่อพันธุ์': b.sire||'',
    'คาดคลอด': b.expected||'',
    'ผลตรวจ': b.result||'',
    'วันคลอดจริง': b.actualBirth||'',
    'เพศลูก': b.sex||'',
    'บันทึกโดย': b.recordedBy||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(breed), 'ผสมพันธุ์');

  // 6) Grass
  const grass = DB.grass.sort((a,b)=>b.date.localeCompare(a.date)).map(g=>({
    'วันที่': g.date,
    'แปลง': g.plot,
    'ชนิดหญ้า': g.grassType,
    'กิจกรรม': g.activity,
    'ปริมาณ': +g.qty||0,
    'หน่วย': g.unit||'',
    'หมายเหตุ': g.note||'',
    'บันทึกโดย': g.recordedBy||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(grass), 'แปลงหญ้า');

  // 7) Inventory
  const inv = DB.inventory.map(i=>({
    'รายการ': i.name,
    'ประเภท': i.type,
    'คงเหลือ': +i.qty||0,
    'หน่วย': i.unit||'',
    'ขั้นต่ำ': +i.minStock||0,
    'ราคา/หน่วย (฿)': +i.price||0,
    'มูลค่าคงเหลือ (฿)': (+i.qty||0)*(+i.price||0),
    'ผู้ขาย': i.supplier||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(inv), 'สต็อกวัตถุดิบ');

  // 8) Expenses
  const exp = DB.expenses.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>({
    'วันที่': e.date,
    'หมวด': e.category,
    'จำนวน (฿)': +e.amount||0,
    'หมายเหตุ': e.note||'',
    'จำนวนรูปใบเสร็จ': (e.photos||[]).length,
    'บันทึกโดย': e.recordedBy||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(exp), 'ค่าใช้จ่าย');

  // 9) Income
  const inc = DB.income.sort((a,b)=>b.date.localeCompare(a.date)).map(i=>({
    'วันที่': i.date,
    'ประเภท': i.type,
    'ปริมาณ': +i.qty||0,
    'หน่วย': i.unit||'',
    'ราคา/หน่วย': +i.price||0,
    'จำนวน (฿)': +i.amount||0,
    'หมายเหตุ': i.note||''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(inc), 'รายรับ');

  // 10) Employees
  const emp = DB.employees.map(e=>({
    'ชื่อ': e.name,
    'เลขบัตรประชาชน': e.idCard||'',
    'ตำแหน่ง': e.position||'',
    'ประเภทค่าจ้าง': ({monthly:'รายเดือน',daily:'รายวัน',hourly:'รายชั่วโมง'}[e.wageType])||'-',
    'อัตรา (฿)': +e.wage||0
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(emp), 'พนักงาน');

  // 11) Payroll
  const pay = DB.payroll.sort((a,b)=>b.period.localeCompare(a.period)).map(p=>({
    'งวด': p.period,
    'พนักงาน': p.empName,
    'วัน/ชั่วโมง': +p.days||0,
    'ฐาน (฿)': +p.base||0,
    'OT (฿)': +p.ot||0,
    'โบนัส (฿)': +p.bonus||0,
    'หัก (฿)': +p.deduct||0,
    'ประกันสังคม (฿)': +p.sso||0,
    'สุทธิ (฿)': +p.net||0
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pay), 'ค่าแรง');

  // 12) Timeclock
  const tc = DB.timeclock.sort((a,b)=>b.date.localeCompare(a.date)).map(t=>({
    'วันที่': t.date,
    'พนักงาน': t.empName,
    'เข้างาน': t.in||'',
    'ออกงาน': t.out||'',
    'ชั่วโมง': +t.hours||0
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(tc), 'ลงเวลา');

  // 13) Summary
  const totalMilk = DB.milk.reduce((s,m)=>s+(+m.amount||0),0);
  const totalMilkValue = totalMilk * (DB.settings.milkPrice||0);
  const totalExp = DB.expenses.reduce((s,e)=>s+(+e.amount||0),0);
  const totalInc = DB.income.reduce((s,i)=>s+(+i.amount||0),0);
  const summary = [
    {'รายการ':'ชื่อฟาร์ม', 'ค่า': DB.settings.farmName||'-'},
    {'รายการ':'วันที่ส่งออก', 'ค่า': new Date().toLocaleString('th-TH')},
    {'รายการ':'', 'ค่า':''},
    {'รายการ':'จำนวนวัวทั้งหมด', 'ค่า': DB.cows.length},
    {'รายการ':'• กำลังให้นม', 'ค่า': DB.cows.filter(c=>c.status==='lactating').length},
    {'รายการ':'• ตั้งท้อง', 'ค่า': DB.cows.filter(c=>c.status==='pregnant').length},
    {'รายการ':'• พักรีด', 'ค่า': DB.cows.filter(c=>c.status==='dry').length},
    {'รายการ':'• วัวสาว/ลูกวัว', 'ค่า': DB.cows.filter(c=>c.status==='heifer'||c.status==='calf').length},
    {'รายการ':'', 'ค่า':''},
    {'รายการ':'น้ำนมรวม (ลิตร)', 'ค่า': +totalMilk.toFixed(2)},
    {'รายการ':'ราคารับซื้อ (฿/ลิตร)', 'ค่า': DB.settings.milkPrice||0},
    {'รายการ':'มูลค่าน้ำนมรวม (฿)', 'ค่า': +totalMilkValue.toFixed(2)},
    {'รายการ':'', 'ค่า':''},
    {'รายการ':'รายรับรวม (฿)', 'ค่า': +totalInc.toFixed(2)},
    {'รายการ':'รายจ่ายรวม (฿)', 'ค่า': +totalExp.toFixed(2)},
    {'รายการ':'กำไรประมาณ (฿)', 'ค่า': +(totalMilkValue+totalInc-totalExp).toFixed(2)},
    {'รายการ':'ต้นทุน/ลิตร (฿)', 'ค่า': totalMilk>0 ? +(totalExp/totalMilk).toFixed(2) : 0},
    {'รายการ':'', 'ค่า':''},
    {'รายการ':'จำนวนพนักงาน', 'ค่า': DB.employees.length},
    {'รายการ':'รายการบันทึกน้ำนม', 'ค่า': DB.milk.length},
    {'รายการ':'รายการอาหาร', 'ค่า': DB.feed.length},
    {'รายการ':'รายการสุขภาพ', 'ค่า': DB.health.length},
    {'รายการ':'รายการค่าใช้จ่าย', 'ค่า': DB.expenses.length}
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), 'สรุป');

  // 14) กำไรขาดทุนรายเดือน
  const months = {};
  DB.milk.forEach(m=>{
    const k = m.date.slice(0,7);
    if(!months[k]) months[k] = {milk:0, milkValue:0, exp:0, inc:0};
    months[k].milk += +m.amount||0;
  });
  DB.expenses.forEach(e=>{
    const k = e.date.slice(0,7);
    if(!months[k]) months[k] = {milk:0, milkValue:0, exp:0, inc:0};
    months[k].exp += +e.amount||0;
  });
  DB.income.forEach(i=>{
    const k = i.date.slice(0,7);
    if(!months[k]) months[k] = {milk:0, milkValue:0, exp:0, inc:0};
    months[k].inc += +i.amount||0;
  });
  const monthRows = Object.entries(months).sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>{
    const milkValue = v.milk * (DB.settings.milkPrice||0);
    const profit = milkValue + v.inc - v.exp;
    return {
      'เดือน': k,
      'น้ำนม (L)': +v.milk.toFixed(2),
      'มูลค่าน้ำนม (฿)': +milkValue.toFixed(2),
      'รายรับอื่น (฿)': +v.inc.toFixed(2),
      'รายรับรวม (฿)': +(milkValue+v.inc).toFixed(2),
      'รายจ่าย (฿)': +v.exp.toFixed(2),
      'กำไร (฿)': +profit.toFixed(2),
      'ต้นทุน/ลิตร (฿)': v.milk>0?+(v.exp/v.milk).toFixed(2):0,
      'กำไร/ลิตร (฿)': v.milk>0?+(profit/v.milk).toFixed(2):0
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(monthRows), 'กำไรขาดทุนรายเดือน');

  // 15) กำไรรายตัววัว
  const cowProfits = DB.cows.map(c=>{
    const cMilk = DB.milk.filter(m=>m.cowId===c.id);
    const totalL = cMilk.reduce((s,m)=>s+(+m.amount||0),0);
    const milkValue = totalL * (DB.settings.milkPrice||0);
    const feedCost = DB.feed.filter(f=>f.cowId===c.id).reduce((s,f)=>s+(+f.cost||0),0);
    const healthCost = DB.health.filter(h=>h.cowId===c.id).reduce((s,h)=>s+(+h.cost||0),0);
    const days = cMilk.length ? new Set(cMilk.map(m=>m.date)).size : 0;
    return {
      'รหัส': c.code,
      'ชื่อ': c.name||'',
      'สถานะ': statusLabel(c.status),
      'น้ำนมรวม (L)': +totalL.toFixed(2),
      'จำนวนวันรีด': days,
      'เฉลี่ย/วัน (L)': days>0?+(totalL/days).toFixed(2):0,
      'มูลค่านม (฿)': +milkValue.toFixed(2),
      'ค่าอาหาร (฿)': +feedCost.toFixed(2),
      'ค่ารักษา (฿)': +healthCost.toFixed(2),
      'ต้นทุนรวม (฿)': +(feedCost+healthCost).toFixed(2),
      'กำไรประมาณ (฿)': +(milkValue-feedCost-healthCost).toFixed(2)
    };
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cowProfits), 'กำไรรายตัววัว');

  // 16) น้ำนมรายเดือน × รายตัว (Matrix)
  const monthList = Object.keys(months).sort();
  const milkMatrix = DB.cows.filter(c=>DB.milk.some(m=>m.cowId===c.id)).map(c=>{
    const row = {'วัว': c.code+' '+(c.name||'')};
    let total = 0;
    monthList.forEach(mo=>{
      const v = DB.milk.filter(m=>m.cowId===c.id && m.date.startsWith(mo)).reduce((s,m)=>s+(+m.amount||0),0);
      row[mo+' (L)'] = +v.toFixed(2);
      total += v;
    });
    row['รวม (L)'] = +total.toFixed(2);
    return row;
  });
  if(milkMatrix.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(milkMatrix), 'น้ำนมรายเดือน-รายตัว');

  // 17) ค่าใช้จ่ายรายหมวด × เดือน
  const expByCat = {};
  DB.expenses.forEach(e=>{
    const mo = e.date.slice(0,7);
    expByCat[e.category] = expByCat[e.category] || {};
    expByCat[e.category][mo] = (expByCat[e.category][mo]||0) + (+e.amount||0);
  });
  const expMatrix = Object.entries(expByCat).map(([cat, byMo])=>{
    const row = {'หมวด': cat};
    let total = 0;
    monthList.forEach(mo=>{
      const v = byMo[mo]||0;
      row[mo+' (฿)'] = +v.toFixed(2);
      total += v;
    });
    row['รวม (฿)'] = +total.toFixed(2);
    return row;
  });
  if(expMatrix.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expMatrix), 'ค่าใช้จ่ายรายหมวด');

  // 18) KPI รายเดือน
  const kpiRows = monthList.map(mo=>{
    const monthMilk = DB.milk.filter(m=>m.date.startsWith(mo));
    const totalL = monthMilk.reduce((s,m)=>s+(+m.amount||0),0);
    const fats = monthMilk.filter(m=>m.fat).map(m=>+m.fat);
    const pros = monthMilk.filter(m=>m.protein).map(m=>+m.protein);
    const days = new Set(monthMilk.map(m=>m.date)).size || 1;
    const lactInMonth = DB.cows.filter(c=>monthMilk.some(m=>m.cowId===c.id)).length || 1;
    return {
      'เดือน': mo,
      'น้ำนมรวม (L)': +totalL.toFixed(2),
      'จำนวนวันรีด': days,
      'วัวให้นม': lactInMonth,
      'น้ำนม/วัว/วัน (L)': +(totalL/(lactInMonth*days)).toFixed(2),
      'ไขมัน % เฉลี่ย': fats.length?+(fats.reduce((a,b)=>a+b,0)/fats.length).toFixed(2):0,
      'โปรตีน % เฉลี่ย': pros.length?+(pros.reduce((a,b)=>a+b,0)/pros.length).toFixed(2):0,
      'AI ทั้งหมด': DB.breed.filter(b=>b.date.startsWith(mo)).length,
      'ผสมติด': DB.breed.filter(b=>b.date.startsWith(mo)&&b.result==='ติด').length,
      'รักษาโรค': DB.health.filter(h=>h.date.startsWith(mo)).length
    };
  });
  if(kpiRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(kpiRows), 'KPI รายเดือน');

  // 19) Daily น้ำนมรายวัน × รายตัว (last 31 days)
  const today_ = new Date();
  const days31 = [];
  for(let i=30;i>=0;i--){
    const d = new Date(today_); d.setDate(d.getDate()-i);
    days31.push(d.toISOString().split('T')[0]);
  }
  const dailyRows = DB.cows.filter(c=>c.status==='lactating'||c.status==='dry').map(c=>{
    const row = {'วัว': c.code+' '+(c.name||'')};
    let total = 0;
    days31.forEach(d=>{
      const v = DB.milk.filter(m=>m.cowId===c.id && m.date===d).reduce((s,m)=>s+(+m.amount||0),0);
      row[d] = +v.toFixed(2);
      total += v;
    });
    row['รวม 31 วัน'] = +total.toFixed(2);
    return row;
  });
  if(dailyRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dailyRows), 'น้ำนมรายวัน (31 วัน)');

  // 20) Activity logs
  if(DB.logs && DB.logs.length){
    const logRows = DB.logs.slice(0,500).map(l=>({
      'เวลา': new Date(l.date).toLocaleString('th-TH'),
      'ผู้ใช้': l.user||'',
      'บทบาท': l.role==='owner'?'เจ้าของ':'พนักงาน',
      'การกระทำ': l.action,
      'รายละเอียด': l.detail||''
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(logRows), 'บันทึกกิจกรรม');
  }

  // Reorder: สรุป first
  const order = ['สรุป','กำไรขาดทุนรายเดือน','กำไรรายตัววัว','น้ำนมรายเดือน-รายตัว','น้ำนมรายวัน (31 วัน)','ค่าใช้จ่ายรายหมวด','KPI รายเดือน','วัวในฟาร์ม','บันทึกน้ำนม','อาหาร','สุขภาพ','ผสมพันธุ์','แปลงหญ้า','สต็อกวัตถุดิบ','ค่าใช้จ่าย','รายรับ','พนักงาน','ค่าแรง','ลงเวลา','บันทึกกิจกรรม'];
  wb.SheetNames = order.filter(n=>wb.SheetNames.includes(n)).concat(wb.SheetNames.filter(n=>!order.includes(n)));

  // ปรับ column width + freeze header row ทุก sheet
  Object.keys(wb.Sheets).forEach(name=>{
    const ws = wb.Sheets[name];
    const range = XLSX.utils.decode_range(ws['!ref']||'A1');
    const cols = [];
    for(let C=range.s.c; C<=range.e.c; C++){
      let maxLen = 8;
      for(let R=range.s.r; R<=range.e.r; R++){
        const cell = ws[XLSX.utils.encode_cell({c:C,r:R})];
        if(cell && cell.v != null){
          const len = String(cell.v).length;
          if(len > maxLen) maxLen = len;
        }
      }
      cols.push({wch: Math.min(maxLen+2, 40)});
    }
    ws['!cols'] = cols;
    // Freeze header row + filter
    ws['!freeze'] = {xSplit:0, ySplit:1};
    if(range.e.r > 0) ws['!autofilter'] = {ref: ws['!ref']};
  });

  // Download
  const farmName = (DB.settings.farmName||'farm').replace(/[^a-zA-Zก-๙0-9]/g,'_');
  const sheetCount = wb.SheetNames.length;
  XLSX.writeFile(wb, `${farmName}-${today()}.xlsx`);
  log('export-excel','ส่งออก Excel '+sheetCount+' sheets');
  alert(`✅ ส่งออก Excel สำเร็จ! (${sheetCount} sheets)\n\nรวมการวิเคราะห์:\n📊 สรุปรวม + กำไรขาดทุนรายเดือน\n🐄 กำไรรายตัววัว\n📅 น้ำนมรายวัน 31 วัน + รายเดือน\n💸 ค่าใช้จ่ายรายหมวด × เดือน\n📐 KPI รายเดือน\n📋 รายละเอียดทุกประเภท\n\nเปิดได้ทั้ง Excel และ Google Sheets`);
}

function importData(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!confirm('นำเข้าจะแทนที่ข้อมูลทั้งหมด ยืนยัน?')) return;
        DB = {...DB, ...data};
        log('import-data','นำเข้าข้อมูลจาก '+f.name);
        save();
        alert('นำเข้าสำเร็จ');
        refresh();
      }catch(err){ alert('ไฟล์ไม่ถูกต้อง: '+err.message); }

function calcThi(t, h){
  // Temperature-Humidity Index for cows
  return (1.8*t+32) - ((0.55-0.0055*h) * ((1.8*t+32)-58));
}

// ================== INIT ==================
window.addEventListener('cloud-ready',()=>{ cloudReady = true; });

function startApp(){
  // โหลด local cache ก่อน
  try{
    const local = localStorage.getItem('dairy-farm-v5');
    if(local) DB = {...DB, ...JSON.parse(local)};
  }catch(e){}
  // ensure structure
  if(!DB.settings) DB.settings = {ownerPin:'1234',milkPrice:22,farmName:'ฟาร์มวัวนม'};
  if(!DB.settings.ownerPin) DB.settings.ownerPin = '1234';

  // เช็ค URL `?farm=UID` → โหมด staff login (สำหรับพนักงานที่ owner share ลิงก์)
  const params = new URLSearchParams(location.search);
  const staffFarmParam = params.get('farm');
  // ใช้โหมด staff direct ถ้า: มี ?farm + ไม่ได้ login Firebase Auth + window.cloud พร้อม
  const hasFirebaseSession = Object.keys(localStorage).some(k => k.startsWith('firebase:authUser'));
  if(staffFarmParam && window.cloud && !hasFirebaseSession){
    startStaffLogin(staffFarmParam);
    return;
  }

  // ถ้าใช้ Firebase Auth → ให้ AuthListener จัดการ
  if(window.cloud && window.cloud.auth){
    startAuthListener();
    // ขณะรอ auth restore — เช็คว่า user เคย login ไหม
    // ถ้าเคย → แสดง loading spinner (ไม่ flash Landing ก่อน)
    // ถ้าไม่เคย → แสดง Landing ปกติ
    if(!authUser){
      const hasFirebaseSession = Object.keys(localStorage).some(k => k.startsWith('firebase:authUser'));
      const hadPinSession = !!localStorage.getItem('dairy-session');
      if(hasFirebaseSession || hadPinSession) renderLoading();
      else renderLanding();
    }
  } else {
    // Fallback: PIN-only mode (Legacy)
    const savedSession = loadSession();
    if(savedSession && savedSession.role){
      currentUser = savedSession;
      enterApp();
    } else {
      renderLanding();
    }
  }
}

// ============== PWA Install ==============
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  // แสดงปุ่ม install ถ้ามี
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'inline-flex';
});

async function installApp(){
  if(!deferredInstallPrompt){
    alert('ติดตั้งแอพ:\n\n📱 iPhone/iPad (Safari):\nกดปุ่มแชร์ ⤴ ด้านล่าง → "Add to Home Screen"\n\n📱 Android (Chrome):\nกดเมนู ⋮ → "Install app" หรือ "เพิ่มไปยังหน้าจอหลัก"\n\n💻 คอม (Chrome/Edge):\nกดไอคอน ⊕ ที่ address bar');
    return;
  }
  deferredInstallPrompt.prompt();
  const {outcome} = await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'none';
  if(outcome==='accepted') alert('✅ ติดตั้งแอพสำเร็จ! ดูที่หน้าจอหลักของคุณ');
}

// ============== Service Worker ==============
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js', {scope: '/'}).then(reg => {
    console.log('SW registered:', reg.scope);
  }).catch(err => {
    console.warn('SW register failed:', err);
  });
}

window.addEventListener('DOMContentLoaded',()=>{
  loadDarkPref();
  // Register Service Worker
  setTimeout(registerSW, 100);
  // ถ้า Firebase พร้อมแล้ว เริ่มเลย
  if(window.cloud){
    startApp();
  } else {
    // รอ Firebase พร้อม (max 3 วิ — ถ้านานกว่านั้น เริ่มแบบ offline)
    let started = false;
    const begin = ()=>{ if(!started){ started=true; startApp(); } };
    window.addEventListener('cloud-ready', begin, {once:true});
    setTimeout(begin, 3000);
  }
});

// Modal click outside to close
document.addEventListener('click',e=>{
  if(e.target.id==='modalBg') closeModal();
});
</script>
